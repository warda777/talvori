name: talvori
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  font_awesome_flutter: ^10.10.0
  fluentui_system_icons: ^1.1.273
  flutter_svg: ^2.2.1
  image_picker: ^1.0.7
  flutter_dotenv: ^5.1.0
  supabase_flutter: ^2.6.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  http: ^1.2.2
  app_links: ^6.4.1
  # share_handler: ^0.0.25  # Temporär deaktiviert - verursacht iOS-Build-Fehler
  url_launcher: ^6.3.0
  path: ^1.9.0
  audioplayers: ^6.1.0
  go_router: ^16.2.4
  equatable: ^2.0.5
  riverpod_annotation: ^2.6.1
  connectivity_plus: ^6.0.3
  animations: ^2.0.11
  sqflite: ^2.3.3+2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  record: ^6.2.0
  path_provider: ^2.1.5
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.3
  flutter_globe_3d: ^2.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.9
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
  shaders:
    - assets/shaders/talvori_premium_earth.frag
  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/images/mascot/
    - assets/images/world/
    - assets/images/world/previews/firenze_city_entry/
    - assets/images/world/travel/continent_showcase/
    - assets/images/world/travel/country_showcase/cutout/
    - assets/images/world/buildable_islands/forest_clearing/
    - assets/sounds/
    - assets/local_import/default_words_v1.json
