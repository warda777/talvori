<text x="1186" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">new blocker</text>
<rect x="1800" y="830" width="480" height="250" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1800" y="830" width="480" height="13" rx="8" ry="8" fill="#63ad7d"/>
<text x="1826" y="899" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#20302c">Follow-up gate</text>
<text x="1826" y="951" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">research, data,</text>
<text x="1826" y="983" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">AI, social,</text>
<text x="1826" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">metrics or UI</text>
