<text x="686" y="471" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">what happens?</text>
<text x="686" y="503" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">what emotion?</text>
