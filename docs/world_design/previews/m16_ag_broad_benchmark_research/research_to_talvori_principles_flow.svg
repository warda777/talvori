<text x="1226" y="503" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">or why it harms</text>
<rect x="1740" y="350" width="400" height="210" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1740" y="350" width="400" height="13" rx="8" ry="8" fill="#8e7ac8"/>
<text x="1766" y="419" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#20302c">Talvori use</text>
<text x="1766" y="471" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">adapt, reject</text>
<text x="1766" y="503" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">or park</text>
