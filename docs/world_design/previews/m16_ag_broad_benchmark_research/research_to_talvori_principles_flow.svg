<text x="80" y="1849" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64736e">documentation preview only / no code / no app route / no screenshots / no assets / no persistence / no social runtime / no analytics runtime</text>
<rect x="120" y="350" width="400" height="210" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
