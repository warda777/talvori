<rect x="45" y="35" width="2510" height="1830" rx="28" ry="28" fill="#f7f8f4" stroke="#d6dfd7" stroke-width="2"/>
<text x="80" y="146" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#20302c">Research To Talvori Principles</text>
<text x="80" y="195" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#64736e">Research becomes useful only after anti-pressure, safety, privacy and M16-T checks.</text>
