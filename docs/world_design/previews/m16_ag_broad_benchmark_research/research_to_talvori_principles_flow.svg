<rect x="520" y="830" width="480" height="13" rx="8" ry="8" fill="#dc6f6a"/>
<text x="546" y="899" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#20302c">Risk checks</text>
<text x="546" y="951" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">pressure, privacy,</text>
<text x="546" y="983" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">safety, FOMO,</text>
<text x="546" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">pay-to-win</text>
