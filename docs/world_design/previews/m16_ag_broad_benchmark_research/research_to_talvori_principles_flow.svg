<text x="146" y="471" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">source app or game</text>
<text x="146" y="503" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">observation only</text>
<rect x="660" y="350" width="400" height="210" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="660" y="350" width="400" height="13" rx="8" ry="8" fill="#58b7ad"/>
