<rect x="410" y="1320" width="1780" height="13" rx="8" ry="8" fill="#dc6f6a"/>
<text x="436" y="1389" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#20302c">Hard boundary</text>
<text x="436" y="1441" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">No benchmark observation may skip the Talvori gates. Learning value, anti-pressure rules, sensitive safety, privacy and no automatic placement must pass</text>
<text x="436" y="1473" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">before any future implementation prompt exists.</text>
