<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1900" viewBox="0 0 2600 1900">
<rect width="2600" height="1900" fill="#f7f8f4"/>
<rect x="45" y="35" width="2510" height="1830" rx="28" ry="28" fill="#f7f8f4" stroke="#d6dfd7" stroke-width="2"/>
<text x="80" y="146" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#20302c">Metrics / Privacy Gate Map</text>
<text x="80" y="195" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#64736e">Talvori should measure learning quality later, not manipulate retention or expose private context.</text>
<line x1="80" y1="1795" x2="2520" y2="1795" stroke="#d6dfd7" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1849" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64736e">documentation preview only / no code / no app route / no screenshots / no assets / no persistence / no social runtime / no analytics runtime</text>
<rect x="120" y="350" width="400" height="210" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="120" y="350" width="400" height="13" rx="8" ry="8" fill="#63ad7d"/>
<text x="146" y="419" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#20302c">Learning success</text>
<text x="146" y="471" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">understanding</text>
<text x="146" y="503" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">recall quality</text>
<text x="146" y="535" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">context use</text>
<rect x="660" y="350" width="400" height="210" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="660" y="350" width="400" height="13" rx="8" ry="8" fill="#68a6ca"/>
<text x="686" y="419" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#20302c">Motivation</text>
<text x="686" y="471" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">voluntary return</text>
<text x="686" y="503" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">calm pause</text>
<text x="686" y="535" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">no pressure</text>
<rect x="1200" y="350" width="400" height="210" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1200" y="350" width="400" height="13" rx="8" ry="8" fill="#dc6f6a"/>
<text x="1226" y="419" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#20302c">Privacy gate</text>
<text x="1226" y="471" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">word/context</text>
<text x="1226" y="503" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">error/pause data</text>
<text x="1226" y="535" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">opt-in later</text>
<rect x="1740" y="350" width="400" height="210" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1740" y="350" width="400" height="13" rx="8" ry="8" fill="#8e7ac8"/>
<text x="1766" y="419" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#20302c">Decision</text>
<text x="1766" y="471" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">measure?</text>
<text x="1766" y="503" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">park?</text>
<text x="1766" y="535" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">reject?</text>
<line x1="520" y1="455" x2="660" y2="455" stroke="#8fa39c" stroke-width="6" stroke-linecap="round"/>
<polygon points="660,455 632,438 632,472" fill="#8fa39c"/>
<line x1="1060" y1="455" x2="1200" y2="455" stroke="#8fa39c" stroke-width="6" stroke-linecap="round"/>
<polygon points="1200,455 1172,438 1172,472" fill="#8fa39c"/>
<line x1="1600" y1="455" x2="1740" y2="455" stroke="#8fa39c" stroke-width="6" stroke-linecap="round"/>
<polygon points="1740,455 1712,438 1712,472" fill="#8fa39c"/>
<rect x="180" y="820" width="1000" height="300" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="180" y="820" width="1000" height="13" rx="8" ry="8" fill="#63ad7d"/>
<text x="206" y="889" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#20302c">Allowed as planning</text>
<text x="206" y="941" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">define questions, privacy risks, learning metrics, motivation signals and later gate</text>
<text x="206" y="973" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">requirements. No event tracking is created.</text>
<rect x="1420" y="820" width="1000" height="300" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1420" y="820" width="1000" height="13" rx="8" ry="8" fill="#dc6f6a"/>
<text x="1446" y="889" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#20302c">Blocked now</text>
<text x="1446" y="941" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">analytics runtime, provider calls, private context storage, SRS mutation, retention</text>
<text x="1446" y="973" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">pressure or leaderboards.</text>
<line x1="1180" y1="970" x2="1420" y2="970" stroke="#dc6f6a" stroke-width="6" stroke-linecap="round"/>
<polygon points="1420,970 1392,953 1392,987" fill="#dc6f6a"/>
<rect x="430" y="1410" width="1740" height="200" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="430" y="1410" width="1740" height="13" rx="8" ry="8" fill="#d8b64f"/>
<text x="456" y="1479" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#20302c">Metric principle</text>
<text x="456" y="1531" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">A useful metric must improve learning safety and product understanding. It must not optimize guilt, compulsion, private-data extraction or visible</text>
<text x="456" y="1563" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#64736e">placement.</text>
</svg>