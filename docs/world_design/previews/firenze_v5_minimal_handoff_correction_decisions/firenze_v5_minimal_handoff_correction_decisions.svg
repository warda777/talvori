<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1620" viewBox="0 0 2300 1620" role="img" aria-labelledby="title desc">
<title id="title">Firenze V5 minimal handoff correction decisions</title>
<desc id="desc">Decision matrix for Firenze V5 handoff correction candidates from slice 420.</desc>
<defs>
  <radialGradient id="bg" cx="48%" cy="42%" r="75%"><stop offset="0" stop-color="#08213a"/><stop offset="0.65" stop-color="#04101e"/><stop offset="1" stop-color="#020711"/></radialGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style><![CDATA[
    .title{font-family:Arial,Helvetica,sans-serif;font-size:36px;font-weight:800;fill:#eef8ff;letter-spacing:0}
    .subtitle{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#78fff1;letter-spacing:0}
    .small{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#d7edf8;letter-spacing:0}
    .cardTitle{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;fill:#eef8ff;letter-spacing:0}
    .body{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#cfe6f2;letter-spacing:0}
    .tag{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:800;fill:#09131f;letter-spacing:0}
  ]]></style>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<rect x="24" y="24" width="2252" height="1572" rx="24" fill="#03101d" fill-opacity="0.58" stroke="#2287a0" stroke-width="2"/>
<text x="55" y="68" class="title">Firenze V5 minimal handoff correction decisions</text>
<text x="55" y="100" class="subtitle">planning only | not runtime data | not asset | no app UI | no YAML/JSON</text>
<text x="55" y="128" class="small">Decision slice for 420 candidates. This is not a map and creates no new Firenze geometry.</text>
<g transform="translate(55,145)">
<rect width="690" height="350" rx="22" fill="#071827" fill-opacity="0.94" stroke="#74fff1" stroke-width="2"/>
<rect x="0" y="0" width="690" height="7" rx="3.5" fill="#74fff1" filter="url(#glow)"/>
<text x="26" y="45" class="cardTitle">B1/B2/B3 Bridge IDs</text>
<rect x="26" y="66" width="610" height="34" rx="13" fill="#74fff1" fill-opacity="0.92"/>
<text x="44" y="89" class="tag">DECISION: adopt as permanent planning-only metadata</text>
<circle cx="34" cy="127" r="4" fill="#74fff1"/>
<text x="52" y="132" class="body">Existing issue: no explicit bridge</text>
<text x="52" y="157" class="body">IDs in Street Handoff SVGs.</text>
<circle cx="34" cy="187" r="4" fill="#74fff1"/>
<text x="52" y="192" class="body">Decision: add a separate Bridge-ID</text>
<text x="52" y="217" class="body">review metadata layer in final</text>
<text x="52" y="242" class="body">correction.</text>
<circle cx="34" cy="272" r="4" fill="#74fff1"/>
<text x="52" y="277" class="body">Limit: labels/IDs only, no new bridge</text>
<text x="52" y="302" class="body">deck geometry.</text>
</g>
<g transform="translate(805,145)">
<rect width="690" height="350" rx="22" fill="#071827" fill-opacity="0.94" stroke="#d9b15e" stroke-width="2"/>
<rect x="0" y="0" width="690" height="7" rx="3.5" fill="#d9b15e" filter="url(#glow)"/>
<text x="26" y="45" class="cardTitle">Future Paths</text>
<rect x="26" y="66" width="610" height="34" rx="13" fill="#d9b15e" fill-opacity="0.92"/>
<text x="44" y="89" class="tag">DECISION: separate planned/not-walkable family</text>
<circle cx="34" cy="127" r="4" fill="#d9b15e"/>
<text x="52" y="132" class="body">Existing issue: future-path semantics</text>
<text x="52" y="157" class="body">are not explicit in handoff streets.</text>
<circle cx="34" cy="187" r="4" fill="#d9b15e"/>
<text x="52" y="192" class="body">Decision: create a separate dashed</text>
<text x="52" y="217" class="body">review layer.</text>
<circle cx="34" cy="247" r="4" fill="#d9b15e"/>
<text x="52" y="252" class="body">Limit: never read as current walkable</text>
<text x="52" y="277" class="body">PATH-N/PATH-S.</text>
</g>
<g transform="translate(1555,145)">
<rect width="690" height="350" rx="22" fill="#071827" fill-opacity="0.94" stroke="#ff87a4" stroke-width="2"/>
<rect x="0" y="0" width="690" height="7" rx="3.5" fill="#ff87a4" filter="url(#glow)"/>
<text x="26" y="45" class="cardTitle">Boundary Buffer</text>
<rect x="26" y="66" width="610" height="34" rx="13" fill="#ff87a4" fill-opacity="0.92"/>
<text x="44" y="89" class="tag">DECISION: keep as own checkable review area</text>
<circle cx="34" cy="127" r="4" fill="#ff87a4"/>
<text x="52" y="132" class="body">419 issue is</text>
<text x="52" y="157" class="body">representation/stroke-based, not</text>
<text x="52" y="182" class="body">proven geometry conflict.</text>
<circle cx="34" cy="212" r="4" fill="#ff87a4"/>
<text x="52" y="217" class="body">Decision: final correction adds a</text>
<text x="52" y="242" class="body">clean filled review-area layer.</text>
<circle cx="34" cy="272" r="4" fill="#ff87a4"/>
<text x="52" y="277" class="body">Limit: not a runtime no-walk/no-build</text>
<text x="52" y="302" class="body">mask.</text>
</g>
<g transform="translate(55,555)">
<rect width="1065" height="360" rx="22" fill="#071827" fill-opacity="0.94" stroke="#ff4d6d" stroke-width="2"/>
<rect x="0" y="0" width="1065" height="7" rx="3.5" fill="#ff4d6d" filter="url(#glow)"/>
<text x="26" y="45" class="cardTitle">River-Water Corrections</text>
<rect x="26" y="66" width="610" height="34" rx="13" fill="#ff4d6d" fill-opacity="0.92"/>
<text x="44" y="89" class="tag">DECISION: P06 and P13 need real correction candidates</text>
<circle cx="34" cy="127" r="4" fill="#ff4d6d"/>
<text x="52" y="132" class="body">P06: west reserve parcel must become river-clear; prefer</text>
<text x="52" y="157" class="body">clipping or minimal edge correction.</text>
<circle cx="34" cy="187" r="4" fill="#ff4d6d"/>
<text x="52" y="192" class="body">P13: bridge-support parcel may stay river-adjacent, but</text>
<text x="52" y="217" class="body">buildable area cannot intersect Arno water.</text>
<circle cx="34" cy="247" r="4" fill="#ff4d6d"/>
<text x="52" y="252" class="body">River remains no_walk + no_build. These are not false</text>
<text x="52" y="277" class="body">positives.</text>
</g>
<g transform="translate(1180,555)">
<rect width="1065" height="360" rx="22" fill="#071827" fill-opacity="0.94" stroke="#ff9bd2" stroke-width="2"/>
<rect x="0" y="0" width="1065" height="7" rx="3.5" fill="#ff9bd2" filter="url(#glow)"/>
<text x="26" y="45" class="cardTitle">Landmark Protected Cores</text>
<rect x="26" y="66" width="610" height="34" rx="13" fill="#ff9bd2" fill-opacity="0.92"/>
<text x="44" y="89" class="tag">DECISION: hard no-build, true correction needed</text>
<circle cx="34" cy="127" r="4" fill="#ff9bd2"/>
<text x="52" y="132" class="body">Affected: P03, P04, P11, P12, P13, P14.</text>
<circle cx="34" cy="162" r="4" fill="#ff9bd2"/>
<text x="52" y="167" class="body">Parcels may be landmark-adjacent, but protected cores</text>
<text x="52" y="192" class="body">stay clear.</text>
<circle cx="34" cy="222" r="4" fill="#ff9bd2"/>
<text x="52" y="227" class="body">Final correction must either adjust parcel/buildable area</text>
<text x="52" y="252" class="body">or protected-core interpretation explicitly.</text>
</g>
<g transform="translate(55,980)">
<rect width="1065" height="310" rx="22" fill="#071827" fill-opacity="0.94" stroke="#ffd66d" stroke-width="2"/>
<rect x="0" y="0" width="1065" height="7" rx="3.5" fill="#ffd66d" filter="url(#glow)"/>
<text x="26" y="45" class="cardTitle">Landmark Collision Buffers</text>
<rect x="26" y="66" width="610" height="34" rx="13" fill="#ffd66d" fill-opacity="0.92"/>
<text x="44" y="89" class="tag">DECISION: buffer-only proximity can be allowed with constraints</text>
<circle cx="34" cy="127" r="4" fill="#ffd66d"/>
<text x="52" y="132" class="body">Allowed buffer-near: P02, P05, P07, P09, P10.</text>
<circle cx="34" cy="162" r="4" fill="#ffd66d"/>
<text x="52" y="167" class="body">Not allowed as-is when core also intersects: P03, P04,</text>
<text x="52" y="192" class="body">P11, P12, P13, P14.</text>
<circle cx="34" cy="222" r="4" fill="#ffd66d"/>
<text x="52" y="227" class="body">Main/secondary building zones must later remain outside</text>
<text x="52" y="252" class="body">final no-build areas.</text>
</g>
<g transform="translate(1180,980)">
<rect width="1065" height="310" rx="22" fill="#071827" fill-opacity="0.94" stroke="#bb6eff" stroke-width="2"/>
<rect x="0" y="0" width="1065" height="7" rx="3.5" fill="#bb6eff" filter="url(#glow)"/>
<text x="26" y="45" class="cardTitle">Next Slice Gate</text>
<rect x="26" y="66" width="610" height="34" rx="13" fill="#bb6eff" fill-opacity="0.92"/>
<text x="44" y="89" class="tag">DECISION: final Handoff Correction is possible, City Entry is not</text>
<circle cx="34" cy="127" r="4" fill="#bb6eff"/>
<text x="52" y="132" class="body">Allowed next: planning-only final correction layer slice.</text>
<circle cx="34" cy="162" r="4" fill="#bb6eff"/>
<text x="52" y="167" class="body">Still blocked: Flutter, app preview, runtime geometry,</text>
<text x="52" y="192" class="body">YAML/JSON, assets.</text>
<circle cx="34" cy="222" r="4" fill="#bb6eff"/>
<text x="52" y="227" class="body">After correction, rerun Metrics / Reachability /</text>
<text x="52" y="252" class="body">Collision review.</text>
</g>
<rect x="55" y="1360" width="2190" height="70" rx="18" fill="#08253a" stroke="#65fff1" stroke-width="1.5"/>
<text x="82" y="1401" class="subtitle">False positive: Boundary Buffer stroke/ring representation only. True corrections: P06/P13 river and protected-core candidates.</text>
<rect x="55" y="1450" width="2190" height="70" rx="18" fill="#19081b" stroke="#ff5ba8" stroke-width="1.5"/>
<text x="82" y="1491" class="subtitle">Stop: City Entry remains blocked until final handoff correction and a renewed Metrics/Reachability/Collision review pass.</text>
</svg>
