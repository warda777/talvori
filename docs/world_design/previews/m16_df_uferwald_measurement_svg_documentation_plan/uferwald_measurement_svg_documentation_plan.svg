    <path d="M580 90 C700 62 816 123 854 230 C896 347 817 444 681 438 C556 433 485 333 512 220 C528 151 542 112 580 90 Z" fill="url(#purpleHatch)" opacity="0.12"/>

    <g id="anchors">
      <circle class="anchor" cx="404" cy="405" r="17"/><text class="anchorText" x="404" y="405">A1</text>
      <circle class="anchor" cx="482" cy="386" r="17"/><text class="anchorText" x="482" y="386">A2</text>
      <circle class="anchor" cx="347" cy="442" r="17"/><text class="anchorText" x="347" y="442">A3</text>
      <circle class="anchor" cx="376" cy="120" r="17"/><text class="anchorText" x="376" y="120">A4</text>
      <circle class="anchor" cx="698" cy="625" r="17"/><text class="anchorText" x="698" y="625">A5</text>
      <circle class="anchor" cx="667" cy="250" r="17"/><text class="anchorText" x="667" y="250">A6</text>
      <circle class="anchor" cx="490" cy="175" r="17"/><text class="anchorText" x="490" y="175">A7</text>
      <circle class="anchor" cx="635" cy="545" r="17"/><text class="anchorText" x="635" y="545">A8</text>
    </g>

    <text class="small" x="650" y="34">planning canvas: rough schematic only</text>
    <text class="tiny" x="650" y="58">No measured polygon points. No final anchors.</text>
    <text class="tiny" x="650" y="82">Visible plan supports review, not runtime.</text>
  </g>

  <g id="legend" transform="translate(1145 205)">
    <text class="label" x="0" y="0">Layer / Mask Legend</text>
    <rect class="legendSwatch land" x="0" y="25" width="38" height="20"/><text class="small" x="52" y="41">base_rock_shape</text>
    <rect class="legendSwatch water" x="0" y="61" width="38" height="20"/><text class="small" x="52" y="77">water_river_mask</text>
    <rect class="legendSwatch trees" x="0" y="97" width="38" height="20"/><text class="small" x="52" y="113">tree_obstacle_layer</text>
    <rect class="legendSwatch rocks" x="0" y="133" width="38" height="20"/><text class="small" x="52" y="149">rock_cliff_obstacle_layer</text>
    <line x1="0" y1="179" x2="38" y2="179" class="path" stroke-width="15"/><line x1="0" y1="179" x2="38" y2="179" class="pathEdge"/><text class="small" x="52" y="185">walkable_path_layer</text>
    <ellipse class="buildable" cx="19" cy="219" rx="28" ry="16"/><text class="small" x="52" y="225">buildable_zone_layer</text>
    <line x1="0" y1="263" x2="42" y2="263" class="noWalk"/><text class="small" x="52" y="269">no_walk_mask</text>
    <rect class="noBuild" x="0" y="294" width="42" height="24"/><text class="small" x="52" y="312">no_build_mask</text>
    <rect class="bandNorth" x="0" y="338" width="42" height="17"/><rect class="bandMid" x="0" y="355" width="42" height="17"/><rect class="bandSouth" x="0" y="372" width="42" height="17"/><text class="small" x="52" y="367">depth_sort_bands</text>
    <circle class="anchor" cx="19" cy="424" r="14"/><text class="anchorText" x="19" y="424">A</text><text class="small" x="52" y="430">landmark_anchor_layer</text>

    <text class="label" x="0" y="485">Anchor Labels</text>
    <text class="tiny" x="0" y="516">A1 main_build_area_anchor</text>
    <text class="tiny" x="0" y="540">A2 hub_center_anchor</text>
    <text class="tiny" x="0" y="564">A3 house_primary_anchor</text>
    <text class="tiny" x="0" y="588">A4 river_entry_anchor</text>
    <text class="tiny" x="0" y="612">A5 river_exit_anchor</text>
    <text class="tiny" x="0" y="636">A6 grove_anchor</text>
    <text class="tiny" x="0" y="660">A7 reserve_zone_anchor_north</text>
    <text class="tiny" x="0" y="684">A8 reserve_zone_anchor_south</text>

    <text class="label" x="0" y="735">Critical Reading</text>
    <text class="tiny" x="0" y="764">Build zones = organic suitability areas,</text>
    <text class="tiny" x="0" y="786">not fixed slots or category plots.</text>
    <text class="tiny" x="0" y="814">Paths = planning corridors, not</text>
    <text class="tiny" x="0" y="836">runtime pathfinding or collision.</text>
  </g>

  <g transform="translate(60 1000)">
    <text class="small" x="0" y="0">M16-DF status: documentation_only / not_runtime_data / not_asset / not_engine_ready</text>
    <text class="small" x="0" y="28">No final coordinates. No JSON/YAML runtime data. No Figma write. No assets. No App integration.</text>
  </g>
</svg>
