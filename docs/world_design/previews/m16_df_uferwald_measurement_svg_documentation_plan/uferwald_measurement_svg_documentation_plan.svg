    <ellipse class="buildable" cx="504" cy="432" rx="112" ry="72"/>
    <ellipse class="buildable" cx="313" cy="520" rx="88" ry="54"/>
    <ellipse class="buildable" cx="631" cy="560" rx="105" ry="58"/>

