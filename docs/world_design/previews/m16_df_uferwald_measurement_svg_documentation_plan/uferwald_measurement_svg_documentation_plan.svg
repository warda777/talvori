<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Uferwald Measurement SVG Documentation Plan</title>
  <desc id="desc">Documentation-only schematic for Uferwald technical layers, masks, zones, anchors and depth bands. Not runtime data, not asset, not engine-ready.</desc>
  <defs>
    <style>
      .bg { fill: #f6f1e8; }
      .panel { fill: #fffaf0; stroke: #2d3440; stroke-width: 2; }
      .title { font: 700 34px Arial, sans-serif; fill: #24303c; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #405061; }
      .label { font: 700 18px Arial, sans-serif; fill: #26313b; }
      .small { font: 500 15px Arial, sans-serif; fill: #344251; }
      .tiny { font: 500 13px Arial, sans-serif; fill: #344251; }
      .status { font: 700 16px Arial, sans-serif; fill: #24303c; }
      .badge { fill: #e9f2ff; stroke: #395873; stroke-width: 1.5; }
      .badge2 { fill: #fff1dc; stroke: #8b6a2b; stroke-width: 1.5; }
      .land { fill: #d9bd7f; stroke: #7a5b31; stroke-width: 5; stroke-dasharray: 14 10; }
      .grass { fill: #9fcf84; opacity: 0.82; stroke: #477a3b; stroke-width: 3; }
      .water { fill: #69b9d6; opacity: 0.78; stroke: #1e7899; stroke-width: 4; }
      .trees { fill: #4e8f56; opacity: 0.82; stroke: #255d31; stroke-width: 3; }
      .rocks { fill: #9d9a8d; opacity: 0.86; stroke: #60635e; stroke-width: 3; }
      .path { fill: none; stroke: #f4e7bc; stroke-width: 32; stroke-linecap: round; stroke-linejoin: round; }
      .pathEdge { fill: none; stroke: #9d7d3f; stroke-width: 4; stroke-dasharray: 10 10; stroke-linecap: round; stroke-linejoin: round; }
      .buildable { fill: #5fc681; opacity: 0.35; stroke: #177a40; stroke-width: 4; stroke-dasharray: 12 8; }
      .noWalk { fill: none; stroke: #d74d45; stroke-width: 6; stroke-dasharray: 8 8; }
      .noBuild { fill: #a463d8; opacity: 0.16; stroke: #7b37a8; stroke-width: 4; stroke-dasharray: 14 8; }
      .bandNorth { fill: #7cb8db; opacity: 0.16; }
      .bandMid { fill: #8ad08d; opacity: 0.13; }
      .bandSouth { fill: #f0b36b; opacity: 0.14; }
      .anchor { fill: #fffdf6; stroke: #202733; stroke-width: 4; }
      .anchorText { font: 700 15px Arial, sans-serif; fill: #202733; text-anchor: middle; dominant-baseline: central; }
      .legendSwatch { stroke: #2d3440; stroke-width: 1.2; }
    </style>
    <pattern id="redHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#d74d45" stroke-width="3" opacity="0.55"/>
    </pattern>
    <pattern id="purpleHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#7b37a8" stroke-width="3" opacity="0.45"/>
    </pattern>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1100"/>
  <text class="title" x="60" y="58">M16-DF Uferwald Measurement SVG Documentation Plan</text>
  <text class="subtitle" x="60" y="88">Technical layer and mask review visual. No final coordinates. No runtime map data.</text>

  <g transform="translate(60 112)">
    <rect class="badge" x="0" y="0" width="205" height="34" rx="8"/>
    <text class="status" x="18" y="23">documentation_only</text>
    <rect class="badge" x="220" y="0" width="185" height="34" rx="8"/>
    <text class="status" x="238" y="23">not_runtime_data</text>
    <rect class="badge2" x="420" y="0" width="118" height="34" rx="8"/>
    <text class="status" x="440" y="23">not_asset</text>
    <rect class="badge2" x="553" y="0" width="170" height="34" rx="8"/>
    <text class="status" x="571" y="23">not_engine_ready</text>
  </g>

  <rect class="panel" x="50" y="170" width="1040" height="800" rx="14"/>
  <rect class="panel" x="1120" y="170" width="430" height="800" rx="14"/>

