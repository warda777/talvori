<line x1="2210" y1="560" x2="2290" y2="560" stroke="#8fa19a" stroke-width="6" stroke-linecap="round"/>
<polygon points="2290,560 2262,542 2262,578" fill="#8fa19a"/>
<rect x="250" y="1060" width="1310" height="370" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="250" y="1060" width="1310" height="16" rx="9" ry="9" fill="#69ad78"/>
<text x="280" y="1129" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Allowed in M16-AN</text>
<text x="280" y="1188" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">348 gate doc, documentation diagrams, PNG + SVG, Visual-QA, status and scope checks.</text>
<rect x="1840" y="1060" width="1310" height="370" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="1840" y="1060" width="1310" height="16" rx="9" ry="9" fill="#d96d67"/>
<text x="1870" y="1129" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Not allowed in M16-AN</text>
<text x="1870" y="1188" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">No lib/, assets/, test/, integration_test/, route file, app entry, DB write or runtime configuration.</text>
<rect x="640" y="1720" width="2120" height="330" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="640" y="1720" width="2120" height="16" rx="9" ry="9" fill="#8979c7"/>
<text x="670" y="1789" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Boundary sentence</text>
<text x="670" y="1848" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">A documented gate is not an implementation approval. Code needs a separate prompt and explicit release.</text>
