<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="2550" viewBox="0 0 3400 2550">
<rect width="3400" height="2550" fill="#f8f9f4"/>
<rect x="48" y="38" width="3304" height="2474" rx="30" ry="30" fill="#f8f9f4" stroke="#d6ded7" stroke-width="2"/>
<text x="92" y="148" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#1e2b28">Isolated Preview Boundary</text>
<text x="92" y="203" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#64736d">M16-AN prepares the Bank preview prompt, but does not create app code.</text>
<line x1="92" y1="2438" x2="3308" y2="2438" stroke="#d6ded7" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="2490" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64736d">M16-AN gate only / no implementation / no route / no persistence / no SRS write / no BuildState / no frame_started</text>
<rect x="150" y="360" width="970" height="400" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="150" y="360" width="970" height="16" rx="9" ry="9" fill="#67a7cb"/>
<text x="180" y="429" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Now: documentation gate</text>
<text x="180" y="488" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Create rules, acceptance criteria, prompt draft and visuals only. No Flutter or Dart files in this slice.</text>
<rect x="1230" y="360" width="970" height="400" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="1230" y="360" width="970" height="16" rx="9" ry="9" fill="#58b8aa"/>
<text x="1260" y="429" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Later: isolated preview</text>
<text x="1260" y="488" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">A separately approved widget preview may show local Bank choice states with setState only.</text>
<rect x="2310" y="360" width="940" height="400" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="2310" y="360" width="940" height="16" rx="9" ry="9" fill="#d96d67"/>
<text x="2340" y="429" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Still blocked</text>
<text x="2340" y="488" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Route, navigation, persistence, SRS, assets, BuildState, frame_started and product mechanics.</text>
