<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="2550" viewBox="0 0 3400 2550">
<rect width="3400" height="2550" fill="#f8f9f4"/>
<rect x="48" y="38" width="3304" height="2474" rx="30" ry="30" fill="#f8f9f4" stroke="#d6ded7" stroke-width="2"/>
<text x="92" y="148" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#1e2b28">Play-First Preview Check</text>
<text x="92" y="203" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#64736d">The Bank preview must feel like a tiny game moment, not a vocabulary test.</text>
<line x1="92" y1="2438" x2="3308" y2="2438" stroke="#d6ded7" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="2490" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64736d">M16-AN gate only / no implementation / no route / no persistence / no SRS write / no BuildState / no frame_started</text>
<rect x="180" y="350" width="1420" height="320" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="180" y="350" width="1420" height="16" rx="9" ry="9" fill="#69ad78"/>
<text x="210" y="419" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Game moment</text>
<text x="210" y="478" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Choose the meaning door that fits the river scene.</text>
<rect x="1760" y="350" width="1420" height="320" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="1760" y="350" width="1420" height="16" rx="9" ry="9" fill="#67a7cb"/>
<text x="1790" y="419" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Curiosity</text>
<text x="1790" y="478" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Why is Bank near a river? The scene invites a tiny inference.</text>
<rect x="180" y="780" width="1420" height="320" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="180" y="780" width="1420" height="16" rx="9" ry="9" fill="#58b8aa"/>
<text x="210" y="849" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Challenge</text>
<text x="210" y="908" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Infer sense from context instead of translating a word.</text>
<rect x="1760" y="780" width="1420" height="320" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="1760" y="780" width="1420" height="16" rx="9" ry="9" fill="#d7b95b"/>
<text x="1790" y="849" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Reward feel</text>
<text x="1790" y="908" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">The scene resolves and a ContextCard/Codex Discovery appears.</text>
<rect x="180" y="1210" width="1420" height="320" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="180" y="1210" width="1420" height="16" rx="9" ry="9" fill="#69ad78"/>
<text x="210" y="1279" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Learning result</text>
<text x="210" y="1338" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Context decides meaning; one word can have multiple homes.</text>
<rect x="1760" y="1210" width="1420" height="320" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="1760" y="1210" width="1420" height="16" rx="9" ry="9" fill="#8979c7"/>
<text x="1790" y="1279" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Not school-like</text>
<text x="1790" y="1338" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">No worksheet, no timer, no score chase, no Pflichtreview.</text>
<rect x="180" y="1640" width="1420" height="320" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="180" y="1640" width="1420" height="16" rx="9" ry="9" fill="#d96d67"/>
<text x="210" y="1709" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Pressure blocked</text>
<text x="210" y="1768" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">No FOMO, Streak guilt, XP grind, loss, social pressure or punishment.</text>
<rect x="1760" y="1640" width="1420" height="320" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="1760" y="1640" width="1420" height="16" rx="9" ry="9" fill="#8f9d98"/>
<text x="1790" y="1709" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Safe exits</text>
<text x="1790" y="1768" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Later, Codex, Backlog, Change and end without duty.</text>
</svg>