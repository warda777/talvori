<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="2550" viewBox="0 0 3400 2550">
<rect width="3400" height="2550" fill="#f8f9f4"/>
<rect x="48" y="38" width="3304" height="2474" rx="30" ry="30" fill="#f8f9f4" stroke="#d6ded7" stroke-width="2"/>
<text x="92" y="148" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#1e2b28">Launch Option Matrix</text>
<text x="92" y="203" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#64736d">Only a future isolated run target is safe enough for local visibility.</text>
<line x1="92" y1="2438" x2="3308" y2="2438" stroke="#d6ded7" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="2490" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64736d">M16-AP launch gate only / no code / no route / no app integration / no persistence / no BuildState / no frame_started</text>
<rect x="170" y="390" width="910" height="460" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="170" y="390" width="910" height="16" rx="9" ry="9" fill="#69ad78"/>
<text x="200" y="459" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Option A</text>
<text x="200" y="518" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Separate preview_main.dart</text>
<text x="200" y="545" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Local flutter run -t</text>
<text x="200" y="572" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">No route, no app wiring</text>
<text x="200" y="599" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Recommended</text>
<rect x="1245" y="390" width="910" height="460" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="1245" y="390" width="910" height="16" rx="9" ry="9" fill="#67a7cb"/>
<text x="1275" y="459" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Option B</text>
<text x="1275" y="518" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">No launch file</text>
<text x="1275" y="545" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Safest, but not visible</text>
<text x="1275" y="572" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Keeps widget code-only</text>
<text x="1275" y="599" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Useful if launch is too early</text>
<rect x="2320" y="390" width="910" height="460" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="2320" y="390" width="910" height="16" rx="9" ry="9" fill="#d96d67"/>
<text x="2350" y="459" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Option C</text>
<text x="2350" y="518" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Temporary app hook</text>
<text x="2350" y="545" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Touches app flow risk</text>
<text x="2350" y="572" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Needs own integration gate</text>
<text x="2350" y="599" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Blocked now</text>
<rect x="360" y="1180" width="2680" height="360" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="360" y="1180" width="2680" height="16" rx="9" ry="9" fill="#69ad78"/>
<text x="390" y="1249" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Decision</text>
<text x="390" y="1308" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Recommend Option A for a later slice: create only bank_meaning_puzzle_preview_main.dart with MaterialApp(home: BankMeaningPuzzlePreview()).</text>
<rect x="620" y="1810" width="2160" height="290" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="620" y="1810" width="2160" height="16" rx="9" ry="9" fill="#8979c7"/>
<text x="650" y="1879" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Still not product integration</text>
<text x="650" y="1938" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">A local launch target is a manual sandbox entry, not a route, screen registration, Home entry, provider, data path or app navigation.</text>
</svg>