<text x="180" y="538" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">BankMeaningPuzzlePreview</text>
<text x="180" y="565" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Already isolated</text>
<text x="180" y="592" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Material only</text>
