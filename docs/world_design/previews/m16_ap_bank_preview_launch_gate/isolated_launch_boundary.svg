<text x="1780" y="479" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Visible preview</text>
<text x="1780" y="538" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Scene, choices, Calm Retry</text>
<text x="1780" y="565" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Safe exits, guardrails</text>
<line x1="2390" y1="610" x2="2530" y2="610" stroke="#8fa19a" stroke-width="6" stroke-linecap="round"/>
