<rect x="2550" y="410" width="630" height="16" rx="9" ry="9" fill="#d96d67"/>
<text x="2580" y="479" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">No product effect</text>
<text x="2580" y="538" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">No route, no persistence</text>
<text x="2580" y="565" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">No SRS, no BuildState</text>
<rect x="390" y="1160" width="1120" height="390" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="390" y="1160" width="1120" height="16" rx="9" ry="9" fill="#69ad78"/>
<text x="420" y="1229" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Allowed future launch</text>
<text x="420" y="1288" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Only a local preview entrypoint, not imported by the app. It starts the existing widget directly.</text>
<rect x="1890" y="1160" width="1120" height="390" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="1890" y="1160" width="1120" height="16" rx="9" ry="9" fill="#d96d67"/>
<text x="1920" y="1229" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Blocked boundary crossing</text>
<text x="1920" y="1288" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">No Home, router, navigation, provider, data layer, assets, tests or integration hooks.</text>
<rect x="700" y="1840" width="2000" height="280" rx="20" ry="20" fill="#ffffff" stroke="#d6ded7" stroke-width="2"/>
<rect x="700" y="1840" width="2000" height="16" rx="9" ry="9" fill="#8979c7"/>
<text x="730" y="1909" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Gate rule</text>
<text x="730" y="1968" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">If a later slice touches anything except the isolated launch file, it is no longer M16-AP-safe.</text>
</svg>