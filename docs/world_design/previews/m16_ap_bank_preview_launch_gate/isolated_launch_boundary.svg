<text x="980" y="479" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1e2b28">Future local main</text>
<text x="980" y="538" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Widgets binding</text>
<text x="980" y="565" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">MaterialApp home</text>
<text x="980" y="592" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64736d">Manual flutter run -t</text>
