<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">citizen_base_01 sprite sheet layout specification</title>
  <desc id="desc">Technical documentation diagram for Talvori base character sprite sheet layout, anchors and motion pipeline.</desc>
  <defs>
    <style>
      .bg { fill: #111827; }
      .panel { fill: #172235; stroke: #36506f; stroke-width: 2; }
      .panel2 { fill: #132b2c; stroke: #3d6b67; stroke-width: 2; }
      .panel3 { fill: #291f35; stroke: #665081; stroke-width: 2; }
      .title { fill: #f7f1df; font-family: Inter, Arial, sans-serif; font-size: 34px; font-weight: 800; }
      .subtitle { fill: #b8c3d7; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 500; }
      .h { fill: #f7f1df; font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 800; }
      .text { fill: #d9e2ee; font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 500; }
      .small { fill: #c4d0df; font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 500; }
      .label { fill: #0d1726; font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 800; }
      .lightLabel { fill: #f7f1df; font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 800; }
      .cell { fill: #21324b; stroke: #6683a7; stroke-width: 1.2; }
      .cellWalk { fill: #203d39; stroke: #73a49b; stroke-width: 1.2; }
      .frame { fill: #d9e9ff; stroke: #ffffff; stroke-width: 1.5; }
      .anchor { fill: #ffcf5a; stroke: #1a2433; stroke-width: 2; }
      .shadow { fill: #0d1117; opacity: 0.36; }
      .arrow { stroke: #ffcf5a; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHead); }
      .thinArrow { stroke: #83d2c8; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHeadTeal); }
      .card { fill: #ffcf5a; stroke: #ffe8a4; stroke-width: 1.5; }
      .card2 { fill: #83d2c8; stroke: #b4eee8; stroke-width: 1.5; }
      .warning { fill: #ffdf82; font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ffcf5a"/>
    </marker>
    <marker id="arrowHeadTeal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#83d2c8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1050"/>
  <text class="title" x="70" y="68">citizen_base_01 Sprite Sheet Layout</text>
  <text class="subtitle" x="70" y="100">Technical specification only: no generated game art, no runtime character integration.</text>

  <rect class="panel" x="60" y="135" width="700" height="440" rx="18"/>
  <text class="h" x="90" y="178">8-direction sheet rule</text>
  <text class="text" x="90" y="210">Rows are directions. Columns are frames. Frame size is fixed.</text>
  <text class="small" x="90" y="236">Direction order: N, NE, E, SE, S, SW, W, NW</text>

  <text class="small" x="170" y="270">idle_8dir: 2 frames</text>
  <text class="small" x="372" y="270">walk_8dir: 4 frames</text>
  <g transform="translate(95,288)">
    <text class="lightLabel" x="0" y="19">N</text>
    <rect class="cell" x="70" y="0" width="52" height="24" rx="5"/><rect class="cell" x="132" y="0" width="52" height="24" rx="5"/>
    <rect class="cellWalk" x="270" y="0" width="48" height="24" rx="5"/><rect class="cellWalk" x="328" y="0" width="48" height="24" rx="5"/><rect class="cellWalk" x="386" y="0" width="48" height="24" rx="5"/><rect class="cellWalk" x="444" y="0" width="48" height="24" rx="5"/>

    <text class="lightLabel" x="0" y="53">NE</text>
    <rect class="cell" x="70" y="34" width="52" height="24" rx="5"/><rect class="cell" x="132" y="34" width="52" height="24" rx="5"/>
    <rect class="cellWalk" x="270" y="34" width="48" height="24" rx="5"/><rect class="cellWalk" x="328" y="34" width="48" height="24" rx="5"/><rect class="cellWalk" x="386" y="34" width="48" height="24" rx="5"/><rect class="cellWalk" x="444" y="34" width="48" height="24" rx="5"/>

    <text class="lightLabel" x="0" y="87">E</text>
    <rect class="cell" x="70" y="68" width="52" height="24" rx="5"/><rect class="cell" x="132" y="68" width="52" height="24" rx="5"/>
    <rect class="cellWalk" x="270" y="68" width="48" height="24" rx="5"/><rect class="cellWalk" x="328" y="68" width="48" height="24" rx="5"/><rect class="cellWalk" x="386" y="68" width="48" height="24" rx="5"/><rect class="cellWalk" x="444" y="68" width="48" height="24" rx="5"/>

    <text class="lightLabel" x="0" y="121">SE</text>
    <rect class="cell" x="70" y="102" width="52" height="24" rx="5"/><rect class="cell" x="132" y="102" width="52" height="24" rx="5"/>
    <rect class="cellWalk" x="270" y="102" width="48" height="24" rx="5"/><rect class="cellWalk" x="328" y="102" width="48" height="24" rx="5"/><rect class="cellWalk" x="386" y="102" width="48" height="24" rx="5"/><rect class="cellWalk" x="444" y="102" width="48" height="24" rx="5"/>

    <text class="lightLabel" x="0" y="155">S</text>
    <rect class="cell" x="70" y="136" width="52" height="24" rx="5"/><rect class="cell" x="132" y="136" width="52" height="24" rx="5"/>
    <rect class="cellWalk" x="270" y="136" width="48" height="24" rx="5"/><rect class="cellWalk" x="328" y="136" width="48" height="24" rx="5"/><rect class="cellWalk" x="386" y="136" width="48" height="24" rx="5"/><rect class="cellWalk" x="444" y="136" width="48" height="24" rx="5"/>

    <text class="lightLabel" x="0" y="189">SW</text>
    <rect class="cell" x="70" y="170" width="52" height="24" rx="5"/><rect class="cell" x="132" y="170" width="52" height="24" rx="5"/>
    <rect class="cellWalk" x="270" y="170" width="48" height="24" rx="5"/><rect class="cellWalk" x="328" y="170" width="48" height="24" rx="5"/><rect class="cellWalk" x="386" y="170" width="48" height="24" rx="5"/><rect class="cellWalk" x="444" y="170" width="48" height="24" rx="5"/>

    <text class="lightLabel" x="0" y="223">W</text>
    <rect class="cell" x="70" y="204" width="52" height="24" rx="5"/><rect class="cell" x="132" y="204" width="52" height="24" rx="5"/>
    <rect class="cellWalk" x="270" y="204" width="48" height="24" rx="5"/><rect class="cellWalk" x="328" y="204" width="48" height="24" rx="5"/><rect class="cellWalk" x="386" y="204" width="48" height="24" rx="5"/><rect class="cellWalk" x="444" y="204" width="48" height="24" rx="5"/>

    <text class="lightLabel" x="0" y="257">NW</text>
    <rect class="cell" x="70" y="238" width="52" height="24" rx="5"/><rect class="cell" x="132" y="238" width="52" height="24" rx="5"/>
    <rect class="cellWalk" x="270" y="238" width="48" height="24" rx="5"/><rect class="cellWalk" x="328" y="238" width="48" height="24" rx="5"/><rect class="cellWalk" x="386" y="238" width="48" height="24" rx="5"/><rect class="cellWalk" x="444" y="238" width="48" height="24" rx="5"/>
  </g>
  <text class="small" x="90" y="552">Rows remain stable across idle and walk sheets.</text>

  <rect class="panel2" x="805" y="135" width="735" height="440" rx="18"/>
  <text class="h" x="835" y="178">Frame anchors and runtime contract</text>
  <text class="text" x="835" y="210">Suggested frame: 96 x 128 px with transparent padding.</text>
  <g transform="translate(870,245)">
    <rect class="frame" x="0" y="0" width="180" height="240" rx="7"/>
    <ellipse class="shadow" cx="90" cy="216" rx="54" ry="13"/>
    <line x1="90" y1="0" x2="90" y2="240" stroke="#6d89a8" stroke-width="1" stroke-dasharray="8 8"/>
    <line x1="0" y1="222" x2="180" y2="222" stroke="#ffcf5a" stroke-width="2" stroke-dasharray="7 7"/>
    <circle class="anchor" cx="90" cy="222" r="9"/>
  </g>
  <text class="small" x="870" y="510">shadow anchor under foot</text>
  <text class="small" x="870" y="530">bottomCenter foot anchor</text>
  <g transform="translate(1110,250)">
    <rect class="card2" x="0" y="0" width="220" height="34" rx="16"/><text class="label" x="20" y="23">visual root stays upright</text>
    <rect class="card2" x="0" y="54" width="230" height="34" rx="16"/><text class="label" x="20" y="77">no whole-body rotation</text>
    <rect class="card2" x="0" y="108" width="245" height="34" rx="16"/><text class="label" x="20" y="131">depth sort by foot position</text>
    <rect class="card2" x="0" y="162" width="220" height="34" rx="16"/><text class="label" x="20" y="185">walk clock is separate</text>
  </g>
  <text class="warning" x="835" y="548">Missing real assets = CHARACTER_ASSET_BLOCKER.</text>
  <text class="warning" x="835" y="568">No code-drawn fallback character.</text>

  <rect class="panel3" x="60" y="610" width="1480" height="390" rx="18"/>
  <text class="h" x="90" y="653">Motion pipeline for Flame Motion Lab 2B</text>
  <text class="text" x="90" y="685">A route provides position and movement vector. The character system chooses bucket, state and frame.</text>

  <g transform="translate(95,735)">
    <rect class="card" x="0" y="0" width="220" height="82" rx="16"/>
    <text class="label" x="24" y="34">route vector</text>
    <text class="label" x="24" y="58">world position</text>
    <path class="arrow" d="M235,41 H292"/>

    <rect class="card" x="310" y="0" width="230" height="82" rx="16"/>
    <text class="label" x="344" y="34">direction bucket</text>
    <text class="label" x="344" y="58">N NE E SE S SW W NW</text>
    <path class="arrow" d="M555,41 H612"/>

    <rect class="card" x="630" y="0" width="220" height="82" rx="16"/>
    <text class="label" x="668" y="34">animation state</text>
    <text class="label" x="668" y="58">idle or walk</text>
    <path class="arrow" d="M865,41 H922"/>

    <rect class="card" x="940" y="0" width="210" height="82" rx="16"/>
    <text class="label" x="982" y="34">sprite frame</text>
    <text class="label" x="982" y="58">fixed foot anchor</text>
    <path class="arrow" d="M1165,41 H1222"/>

    <rect class="card" x="1240" y="0" width="180" height="82" rx="16"/>
    <text class="label" x="1274" y="34">Flame render</text>
    <text class="label" x="1274" y="58">upright sprite</text>
  </g>

  <g transform="translate(380,865)">
    <circle cx="0" cy="0" r="46" fill="#1a2433" stroke="#83d2c8" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-56" stroke="#83d2c8" stroke-width="2"/><text class="small" x="-8" y="-66">N</text>
    <line x1="0" y1="0" x2="40" y2="-40" stroke="#83d2c8" stroke-width="2"/><text class="small" x="42" y="-44">NE</text>
    <line x1="0" y1="0" x2="56" y2="0" stroke="#83d2c8" stroke-width="2"/><text class="small" x="62" y="6">E</text>
    <line x1="0" y1="0" x2="40" y2="40" stroke="#83d2c8" stroke-width="2"/><text class="small" x="42" y="52">SE</text>
    <line x1="0" y1="0" x2="0" y2="56" stroke="#83d2c8" stroke-width="2"/><text class="small" x="-8" y="76">S</text>
    <line x1="0" y1="0" x2="-40" y2="40" stroke="#83d2c8" stroke-width="2"/><text class="small" x="-72" y="52">SW</text>
    <line x1="0" y1="0" x2="-56" y2="0" stroke="#83d2c8" stroke-width="2"/><text class="small" x="-78" y="6">W</text>
    <line x1="0" y1="0" x2="-40" y2="-40" stroke="#83d2c8" stroke-width="2"/><text class="small" x="-76" y="-44">NW</text>
  </g>

  <g transform="translate(905,895)">
    <rect class="frame" x="-72" y="-62" width="144" height="92" rx="7"/>
    <ellipse class="shadow" cx="0" cy="16" rx="40" ry="8"/>
    <circle class="anchor" cx="0" cy="16" r="7"/>
    <text class="small" x="95" y="-10">Foot position</text>
    <text class="small" x="95" y="10">drives depth sorting.</text>
  </g>

  <text class="subtitle" x="90" y="980">2B may render a character only after real citizen_base_01 assets exist. This diagram is specification only.</text>
</svg>
