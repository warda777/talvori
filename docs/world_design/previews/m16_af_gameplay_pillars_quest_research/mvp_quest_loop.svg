<rect x="1255" y="355" width="335" height="13" rx="8" ry="8" fill="#8e7ac8"/>
<text x="1281" y="427" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">User choice</text>
<text x="1281" y="475" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64736e">Confirm, Change, Later,</text>
<text x="1281" y="507" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64736e">Codex, Backlog</text>
<line x1="1600" y1="493" x2="1623" y2="493" stroke="#8ea29a" stroke-width="6" stroke-linecap="round"/>
<polygon points="1623,493 1597,477 1597,509" fill="#8ea29a"/>
