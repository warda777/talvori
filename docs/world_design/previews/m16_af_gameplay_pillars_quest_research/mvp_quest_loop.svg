<text x="1661" y="427" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">World feedback</text>
<text x="1661" y="475" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64736e">small preview or</text>
<text x="1661" y="507" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64736e">explanation</text>
<line x1="1980" y1="493" x2="2003" y2="493" stroke="#8ea29a" stroke-width="6" stroke-linecap="round"/>
<polygon points="2003,493 1977,477 1977,509" fill="#8ea29a"/>
<rect x="2015" y="355" width="335" height="275" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="2015" y="355" width="335" height="13" rx="8" ry="8" fill="#dc6f6a"/>
<text x="2041" y="427" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">Later gate</text>
<text x="2041" y="475" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64736e">implementation remains</text>
<text x="2041" y="507" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64736e">blocked</text>
<rect x="210" y="850" width="820" height="315" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="210" y="850" width="820" height="13" rx="8" ry="8" fill="#63ad7d"/>
<text x="236" y="922" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">Allowed</text>
<text x="236" y="974" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">Word Sense, ContextCard, ActionChallenge, Container</text>
<text x="236" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">Findability, Review Choice, WorldCandidate Explanation and</text>
<text x="236" y="1046" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">Return After Pause as voluntary planning concepts.</text>
<rect x="1350" y="850" width="830" height="315" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1350" y="850" width="830" height="13" rx="8" ry="8" fill="#dc6f6a"/>
<text x="1376" y="922" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">Blocked</text>
<text x="1376" y="974" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">Quest duty, streak guilt, sensitive triggers, auto placement,</text>
<text x="1376" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">SRS or word_progress mutation, BuildState, timers, FOMO,</text>
<text x="1376" y="1046" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">social competition and quest engine code.</text>
<line x1="1060" y1="1010" x2="1325" y2="1010" stroke="#dc6f6a" stroke-width="6" stroke-linecap="round"/>
<polygon points="1325,1010 1299,994 1299,1026" fill="#dc6f6a"/>
<rect x="590" y="1365" width="265" height="42" rx="21" ry="21" fill="#68a6ca"/>
<text x="611" y="1397" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#ffffff">Later always allowed</text>
<rect x="990" y="1365" width="309" height="42" rx="21" ry="21" fill="#63ad7d"/>
<text x="1011" y="1397" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#ffffff">safe defaults stay normal</text>
<rect x="1450" y="1365" width="367" height="42" rx="21" ry="21" fill="#d8b64f"/>
<text x="1471" y="1397" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#ffffff">world feedback is preview only</text>
</svg>