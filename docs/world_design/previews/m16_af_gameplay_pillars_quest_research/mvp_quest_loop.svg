<text x="901" y="427" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">Optional</text>
<text x="901" y="473" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">challenge</text>
<text x="901" y="521" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64736e">only if budget and safety</text>
<text x="901" y="553" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64736e">allow</text>
<line x1="1220" y1="493" x2="1243" y2="493" stroke="#8ea29a" stroke-width="6" stroke-linecap="round"/>
<polygon points="1243,493 1217,477 1217,509" fill="#8ea29a"/>
