<text x="521" y="427" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">Semantic</text>
<text x="521" y="473" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">impulse</text>
<text x="521" y="521" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64736e">Outcome, sense, safety</text>
<text x="521" y="553" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64736e">and type</text>
<line x1="840" y1="493" x2="863" y2="493" stroke="#8ea29a" stroke-width="6" stroke-linecap="round"/>
<polygon points="863,493 837,477 837,509" fill="#8ea29a"/>
<rect x="875" y="355" width="335" height="275" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
