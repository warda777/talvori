<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800">
<rect width="2400" height="1800" fill="#f7f8f4"/>
<rect x="45" y="35" width="2310" height="1730" rx="28" ry="28" fill="#f7f8f4" stroke="#d6dfd7" stroke-width="2"/>
<text x="80" y="146" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#20302c">MVP Quest / Challenge Loop</text>
<text x="80" y="193" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#64736e">Quest is a tiny optional learning moment, not a required mission, timer, engine or build action.</text>
<line x1="80" y1="1700" x2="2320" y2="1700" stroke="#d6dfd7" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1754" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64736e">documentation preview only / no code / no app route / no screenshots / no assets / no persistence / no social runtime</text>
<rect x="115" y="355" width="335" height="275" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="115" y="355" width="335" height="13" rx="8" ry="8" fill="#63ad7d"/>
<text x="141" y="427" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">Learn block</text>
<text x="141" y="475" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64736e">practice or understand a</text>
<text x="141" y="507" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64736e">word</text>
<line x1="460" y1="493" x2="483" y2="493" stroke="#8ea29a" stroke-width="6" stroke-linecap="round"/>
