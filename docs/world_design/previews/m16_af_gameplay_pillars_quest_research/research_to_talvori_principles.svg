<rect x="300" y="1275" width="740" height="13" rx="8" ry="8" fill="#63ad7d"/>
<text x="326" y="1347" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">Allowed now</text>
<text x="326" y="1399" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">Research questions, principle template, risk language</text>
<text x="326" y="1435" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">and next-gate planning.</text>
<rect x="1360" y="1275" width="740" height="240" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1360" y="1275" width="740" height="13" rx="8" ry="8" fill="#dc6f6a"/>
<text x="1386" y="1347" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">Blocked now</text>
<text x="1386" y="1399" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">Blind copy, streak pressure, timers, economy,</text>
<text x="1386" y="1435" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">leaderboards, clans, PvP, quest engine, persistence or</text>
<text x="1386" y="1471" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">app integration.</text>
