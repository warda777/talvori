<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800">
<rect width="2400" height="1800" fill="#f7f8f4"/>
<rect x="45" y="35" width="2310" height="1730" rx="28" ry="28" fill="#f7f8f4" stroke="#d6dfd7" stroke-width="2"/>
<text x="80" y="146" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#20302c">Research To Talvori Principles</text>
<text x="80" y="193" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#64736e">Benchmark work prepares questions and principles. It does not copy mechanics or unlock runtime systems.</text>
<line x1="80" y1="1700" x2="2320" y2="1700" stroke="#d6dfd7" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="1754" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64736e">documentation preview only / no code / no app route / no screenshots / no assets / no persistence / no social runtime</text>
<rect x="135" y="300" width="720" height="330" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="135" y="300" width="720" height="13" rx="8" ry="8" fill="#68a6ca"/>
<text x="161" y="372" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">Duolingo research prep</text>
<text x="161" y="424" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">Habit, streaks, XP, leagues, daily goals, lesson</text>
<text x="161" y="460" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">progression and motivation language. Watch for guilt,</text>
<text x="161" y="496" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">pressure, FOMO and shallow XP chasing.</text>
<rect x="1545" y="300" width="720" height="330" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1545" y="300" width="720" height="13" rx="8" ry="8" fill="#8e7ac8"/>
<text x="1571" y="372" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">Supercell / Clash prep</text>
<text x="1571" y="424" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">Build progression, trade-offs, resources, timers,</text>
<text x="1571" y="460" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">clans, social play, competition and balance. Watch for</text>
<text x="1571" y="496" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">pay-to-win, war pressure and social pressure.</text>
<rect x="865" y="765" width="670" height="310" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="865" y="765" width="670" height="13" rx="8" ry="8" fill="#58b7ad"/>
<text x="891" y="837" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20302c">Translation template</text>
<text x="891" y="889" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">Observation -&gt; Principle -&gt; Talvori application -&gt;</text>
<text x="891" y="925" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">Risk -&gt; Decision -&gt; affected M16-T IDs -&gt; later</text>
<text x="891" y="961" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#64736e">gate before implementation.</text>
