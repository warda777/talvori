<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2500" viewBox="0 0 3200 2500">
<rect width="3200" height="2500" fill="#f8f9f4"/>
<rect x="48" y="38" width="3104" height="2424" rx="30" ry="30" fill="#f8f9f4" stroke="#d7dfd8" stroke-width="2"/>
<text x="92" y="148" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#1e2b28">Playtest Questions For The First Playable Loop</text>
<text x="92" y="203" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#65726d">Future MVP tests must check play feeling before celebrating learning mechanics.</text>
<line x1="92" y1="2388" x2="3108" y2="2388" stroke="#d7dfd8" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="2440" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#65726d">documentation research prep only / no implementation / no app integration / no auto placement / no BuildState / no frame_started</text>
<rect x="180" y="390" width="610" height="300" rx="20" ry="20" fill="#ffffff" stroke="#d7dfd8" stroke-width="2"/>
<rect x="180" y="390" width="610" height="16" rx="9" ry="9" fill="#69ad78"/>
<text x="208" y="462" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1e2b28">Play feeling</text>
<text x="208" y="515" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#65726d">Did this feel like playing?</text>
<rect x="920" y="390" width="610" height="300" rx="20" ry="20" fill="#ffffff" stroke="#d7dfd8" stroke-width="2"/>
<rect x="920" y="390" width="610" height="16" rx="9" ry="9" fill="#67a7cb"/>
<text x="948" y="462" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1e2b28">Learning moment</text>
<text x="948" y="515" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#65726d">When did you notice you learned?</text>
<rect x="1660" y="390" width="610" height="300" rx="20" ry="20" fill="#ffffff" stroke="#d7dfd8" stroke-width="2"/>
<rect x="1660" y="390" width="610" height="16" rx="9" ry="9" fill="#59b7aa"/>
<text x="1688" y="462" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1e2b28">Curiosity</text>
<text x="1688" y="515" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#65726d">Did you want to continue voluntarily?</text>
<rect x="2400" y="390" width="610" height="300" rx="20" ry="20" fill="#ffffff" stroke="#d7dfd8" stroke-width="2"/>
<rect x="2400" y="390" width="610" height="16" rx="9" ry="9" fill="#8979c7"/>
<text x="2428" y="462" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1e2b28">School feeling</text>
<text x="2428" y="515" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#65726d">What felt boring or like homework?</text>
<rect x="180" y="800" width="610" height="300" rx="20" ry="20" fill="#ffffff" stroke="#d7dfd8" stroke-width="2"/>
<rect x="180" y="800" width="610" height="16" rx="9" ry="9" fill="#69ad78"/>
<text x="208" y="872" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1e2b28">Stress</text>
<text x="208" y="925" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#65726d">Did anything feel forced or stressful?</text>
<rect x="920" y="800" width="610" height="300" rx="20" ry="20" fill="#ffffff" stroke="#d7dfd8" stroke-width="2"/>
<rect x="920" y="800" width="610" height="16" rx="9" ry="9" fill="#67a7cb"/>
<text x="948" y="872" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1e2b28">World logic</text>
<text x="948" y="925" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#65726d">Did you understand why the world reacted?</text>
<rect x="1660" y="800" width="610" height="300" rx="20" ry="20" fill="#ffffff" stroke="#d7dfd8" stroke-width="2"/>
<rect x="1660" y="800" width="610" height="16" rx="9" ry="9" fill="#59b7aa"/>
<text x="1688" y="872" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1e2b28">Errors</text>
<text x="1688" y="925" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#65726d">Did mistakes feel safe?</text>
<rect x="2400" y="800" width="610" height="300" rx="20" ry="20" fill="#ffffff" stroke="#d7dfd8" stroke-width="2"/>
<rect x="2400" y="800" width="610" height="16" rx="9" ry="9" fill="#8979c7"/>
<text x="2428" y="872" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1e2b28">Exit</text>
<text x="2428" y="925" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#65726d">Were Later, Codex or Backlog easy to find?</text>
<rect x="250" y="1420" width="1210" height="370" rx="20" ry="20" fill="#ffffff" stroke="#d7dfd8" stroke-width="2"/>
<rect x="250" y="1420" width="1210" height="16" rx="9" ry="9" fill="#69ad78"/>
<text x="278" y="1492" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1e2b28">Pass signal</text>
<text x="278" y="1545" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#65726d">A user can explain the game moment, feels safe after errors, and wants one more tiny discovery without pressure.</text>
<rect x="1740" y="1420" width="1210" height="370" rx="20" ry="20" fill="#ffffff" stroke="#d7dfd8" stroke-width="2"/>
<rect x="1740" y="1420" width="1210" height="16" rx="9" ry="9" fill="#d96d67"/>
<text x="1768" y="1492" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1e2b28">Fail signal</text>
<text x="1768" y="1545" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#65726d">The screen feels like quiz work, text reading, compulsory review, XP chasing, timer stress or world confusion.</text>
<rect x="480" y="2050" width="2240" height="170" rx="20" ry="20" fill="#ffffff" stroke="#d7dfd8" stroke-width="2"/>
<rect x="480" y="2050" width="2240" height="16" rx="9" ry="9" fill="#d6b95a"/>
<text x="508" y="2122" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1e2b28">No implementation release</text>
<text x="508" y="2175" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#65726d">Playtest criteria are planning checks. They do not create analytics, persistence, tests, routes or runtime mechanics.</text>
</svg>