<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Firenze Master Technical Layout Readiness Check</title>
  <desc id="desc">Documentation-only readiness flow from Master SVG to allowed reads, forbidden runtime outputs and recommended next slice.</desc>
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061927"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073022"/>
      <stop offset="1" stop-color="#0a1620"/>
    </linearGradient>
    <linearGradient id="stopPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#321527"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <style>
      .title { font: 800 40px Inter, "SF Pro Display", Arial, sans-serif; fill: #f4fbff; }
      .subtitle { font: 700 20px Inter, "SF Pro Display", Arial, sans-serif; fill: #7ff9ec; }
      .small { font: 500 17px Inter, "SF Pro Display", Arial, sans-serif; fill: #b8cedb; }
      .panelTitle { font: 800 25px Inter, "SF Pro Display", Arial, sans-serif; fill: #effaff; }
      .panelText { font: 600 18px Inter, "SF Pro Display", Arial, sans-serif; fill: #d7e9f1; }
      .muted { font: 500 15px Inter, "SF Pro Display", Arial, sans-serif; fill: #9db7c6; }
      .chip { font: 800 15px Inter, "SF Pro Display", Arial, sans-serif; fill: #e9fff9; }
      .arrow { fill: none; stroke: #64ffe6; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHead); }
      .stopArrow { fill: none; stroke: #ff8ab3; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 8; marker-end: url(#stopHead); }
    </style>
    <marker id="arrowHead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#64ffe6"/>
    </marker>
    <marker id="stopHead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#ff8ab3"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="#020a12"/>
  <ellipse cx="290" cy="180" rx="560" ry="190" fill="#11384b" opacity="0.28"/>
  <ellipse cx="1060" cy="860" rx="710" ry="250" fill="#0b3c32" opacity="0.20"/>
  <ellipse cx="1270" cy="210" rx="390" ry="170" fill="#3d204f" opacity="0.16"/>

  <text x="46" y="70" class="title">Firenze Master Technical Layout Readiness Check</text>
  <text x="48" y="104" class="subtitle">documentation_only | planning_source_check | no runtime | no JSON/YAML | no Flutter</text>
  <text x="48" y="136" class="small">Flow: Master-SVG -> allowed reads -> forbidden runtime outputs -> recommended next slice</text>

  <g transform="translate(48 180)">
    <rect width="330" height="295" rx="26" fill="url(#panel)" stroke="#2fe4ff" stroke-width="1.5"/>
    <text x="28" y="44" class="panelTitle">1. Master-SVG</text>
    <text x="28" y="82" class="panelText">firenze_city_exploration</text>
    <text x="28" y="112" class="panelText">master.svg</text>
    <text x="28" y="143" class="muted">Stable technical planning source</text>
    <g transform="translate(28 145)">
      <rect width="132" height="34" rx="13" fill="#073224" stroke="#7dffd8"/>
      <text x="16" y="23" class="chip">IDs: PASS</text>
      <rect x="150" width="136" height="34" rx="13" fill="#073224" stroke="#7dffd8"/>
      <text x="166" y="23" class="chip">Graph: PASS</text>
      <rect y="48" width="155" height="34" rx="13" fill="#073224" stroke="#7dffd8"/>
      <text x="16" y="71" class="chip">Layers: PASS</text>
      <rect x="174" y="48" width="108" height="34" rx="13" fill="#191736" stroke="#c897ff"/>
      <text x="190" y="71" class="chip">JSON: NO</text>
    </g>
    <text x="28" y="255" class="muted">Boundary 1 | River 1 | Parcels 14</text>
    <text x="28" y="280" class="muted">Nodes 181 | Edges 221</text>
  </g>

  <path d="M 395 327 C 455 327 472 327 520 327" class="arrow"/>

  <g transform="translate(540 180)">
    <rect width="330" height="295" rx="26" fill="url(#greenPanel)" stroke="#6dffdf" stroke-width="1.5"/>
    <text x="28" y="44" class="panelTitle">2. Allowed Reads</text>
    <text x="28" y="82" class="panelText">Layer families and labels</text>
    <text x="28" y="116" class="muted">Read only as planning evidence</text>
    <text x="28" y="154" class="panelText">Boundary, River, Bridges</text>
    <text x="28" y="188" class="panelText">Roads, Parcels, Landmarks</text>
    <text x="28" y="222" class="panelText">Green, Urban, Anchors</text>
    <text x="28" y="256" class="panelText">Graph endpoints from Edge IDs</text>
    <text x="28" y="280" class="muted">No automatic engine semantics</text>
  </g>

  <path d="M 887 327 C 947 327 964 327 1012 327" class="arrow"/>

  <g transform="translate(1032 180)">
    <rect width="330" height="295" rx="26" fill="url(#stopPanel)" stroke="#ff8ab3" stroke-width="1.5"/>
    <text x="28" y="44" class="panelTitle">3. Forbidden Output</text>
    <text x="28" y="82" class="panelText">No Runtime Data</text>
    <text x="28" y="116" class="panelText">No JSON / YAML</text>
    <text x="28" y="150" class="panelText">No Flutter Loader</text>
    <text x="28" y="184" class="panelText">No Collision Masks</text>
    <text x="28" y="218" class="panelText">No Pathfinding</text>
    <text x="28" y="252" class="panelText">No Assets</text>
    <text x="28" y="280" class="muted">Planning source stays planning-only</text>
  </g>

  <path d="M 1197 492 C 1197 560 1197 604 1197 655" class="arrow"/>

  <g transform="translate(922 675)">
    <rect width="550" height="250" rx="28" fill="#062a24" stroke="#80ffd7" stroke-width="1.8" filter="url(#softGlow)"/>
    <text x="30" y="50" class="panelTitle">Recommended Next Slice</text>
    <text x="30" y="91" class="panelText">B) Area-Specification Extraction</text>
    <text x="30" y="128" class="small">Extract planning IDs, families and graph topology first.</text>
    <text x="30" y="162" class="small">Then review metrics, reachability and collision boundaries.</text>
    <text x="30" y="198" class="small">Only after that: a separate Flutter Preview gate.</text>
    <rect x="30" y="212" width="214" height="30" rx="12" fill="#0d3b2d" stroke="#80ffd7"/>
    <text x="47" y="233" class="chip">Flutter first: NOT ADVISED</text>
  </g>

  <path d="M 1032 445 C 840 560 584 570 390 675" class="stopArrow"/>

  <g transform="translate(76 655)">
    <rect width="690" height="270" rx="28" fill="#071522" stroke="#2fe4ff" stroke-width="1.4"/>
    <text x="30" y="50" class="panelTitle">Readiness Decision</text>
    <text x="30" y="91" class="panelText">Master-SVG as planning source: YES</text>
    <text x="30" y="128" class="panelText">Runtime / JSON / YAML / Flutter: NO</text>
    <text x="30" y="165" class="panelText">Minimal next data: IDs, labels, layer roles, graph endpoints</text>
    <text x="30" y="202" class="small">Stop before runtime until Area-Spec, metrics, reachability,</text>
    <text x="30" y="232" class="small">No-Walk/No-Build and source traceability are reviewed.</text>
  </g>

  <g transform="translate(48 980)">
    <rect width="1504" height="72" rx="22" fill="#061927" stroke="#2fe4ff" stroke-width="1"/>
    <text x="28" y="32" class="small">Visual-QA: documentation graphic only, no App UI, no asset, no runtime map. Text kept inside panels; PNG and SVG generated for review.</text>
    <text x="28" y="58" class="muted">Output path: docs/world_design/previews/firenze_master_technical_layout_readiness_check/</text>
  </g>
</svg>
