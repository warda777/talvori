<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2200" viewBox="0 0 3000 2200">
<rect width="3000" height="2200" fill="#f8f9f4"/>
<rect x="48" y="38" width="2904" height="2124" rx="30" ry="30" fill="#f8f9f4" stroke="#d8e0d8" stroke-width="2"/>
<text x="92" y="150" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#1f2c2a">Pressure-Free Retention Principles</text>
<text x="92" y="207" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#66736d">Habit supports voluntary return. It must never create guilt, loss anxiety or sensitive pressure.</text>
<line x1="92" y1="2090" x2="2908" y2="2090" stroke="#d8e0d8" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="2142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#66736d">documentation research preview only / no implementation / no analytics / no push retention / no SRS or word_progress write / no BuildState / no frame_started</text>
<rect x="130" y="410" width="440" height="310" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="130" y="410" width="440" height="16" rx="9" ry="9" fill="#68ad7a"/>
<text x="158" y="482" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Learn</text>
<text x="158" y="536" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Short voluntary learning moment.</text>
<line x1="570" y1="565" x2="650" y2="565" stroke="#95a59f" stroke-width="6" stroke-linecap="round"/>
<polygon points="650,565 622,547 622,583" fill="#95a59f"/>
<rect x="690" y="410" width="440" height="310" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="690" y="410" width="440" height="16" rx="9" ry="9" fill="#68a6ca"/>
<text x="718" y="482" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Gentle signal</text>
<text x="718" y="536" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Small feedback, no build or</text>
<text x="718" y="565" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">persistence.</text>
<line x1="1130" y1="565" x2="1210" y2="565" stroke="#95a59f" stroke-width="6" stroke-linecap="round"/>
<polygon points="1210,565 1182,547 1182,583" fill="#95a59f"/>
<rect x="1250" y="410" width="440" height="310" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1250" y="410" width="440" height="16" rx="9" ry="9" fill="#5bb8aa"/>
<text x="1278" y="482" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Optional review</text>
<text x="1278" y="536" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Only if budget and relevance allow.</text>
<line x1="1690" y1="565" x2="1770" y2="565" stroke="#95a59f" stroke-width="6" stroke-linecap="round"/>
<polygon points="1770,565 1742,547 1742,583" fill="#95a59f"/>
<rect x="1810" y="410" width="440" height="310" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1810" y="410" width="440" height="16" rx="9" ry="9" fill="#d7ba59"/>
<text x="1838" y="482" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Later allowed</text>
<text x="1838" y="536" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Skipping review has no penalty.</text>
<line x1="2250" y1="565" x2="2330" y2="565" stroke="#95a59f" stroke-width="6" stroke-linecap="round"/>
<polygon points="2330,565 2302,547 2302,583" fill="#95a59f"/>
<rect x="2370" y="410" width="440" height="310" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="2370" y="410" width="440" height="16" rx="9" ry="9" fill="#8977c7"/>
<text x="2398" y="482" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Calm return</text>
<text x="2398" y="536" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Pause is neutral, world does not decay.</text>
<rect x="190" y="1000" width="720" height="250" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="190" y="1000" width="720" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="218" y="1072" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">No streak guilt</text>
<text x="218" y="1126" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">No loss message or duty chain.</text>
<rect x="1040" y="1000" width="720" height="250" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1040" y="1000" width="720" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="1068" y="1072" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">No FOMO</text>
<text x="1068" y="1126" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">No countdown, timer, or pressure push.</text>
<rect x="1890" y="1000" width="720" height="250" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1890" y="1000" width="720" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="1918" y="1072" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">No sensitive trigger</text>
<text x="1918" y="1126" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Sensitive words never drive retention.</text>
<rect x="190" y="1330" width="720" height="250" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="190" y="1330" width="720" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="218" y="1402" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">No forced review</text>
<text x="218" y="1456" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">No decision after every word.</text>
<rect x="1040" y="1330" width="720" height="250" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1040" y="1330" width="720" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="1068" y="1402" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">No world penalty</text>
<text x="1068" y="1456" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">No ruins, decay or punishment.</text>
<rect x="1890" y="1330" width="720" height="250" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1890" y="1330" width="720" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="1918" y="1402" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">No analytics gate bypass</text>
<text x="1918" y="1456" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Metrics stay privacy-gated.</text>
</svg>