<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2200" viewBox="0 0 3000 2200">
<rect width="3000" height="2200" fill="#f8f9f4"/>
<rect x="48" y="38" width="2904" height="2124" rx="30" ry="30" fill="#f8f9f4" stroke="#d8e0d8" stroke-width="2"/>
<text x="92" y="150" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#1f2c2a">Talvori MVP Motivation Rules</text>
<text x="92" y="207" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#66736d">The first playable loop may motivate gently, but it cannot mutate learning state or world state.</text>
<line x1="92" y1="2090" x2="2908" y2="2090" stroke="#d8e0d8" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="2142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#66736d">documentation research preview only / no implementation / no analytics / no push retention / no SRS or word_progress write / no BuildState / no frame_started</text>
<rect x="150" y="350" width="560" height="280" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="150" y="350" width="560" height="16" rx="9" ry="9" fill="#68ad7a"/>
<text x="178" y="422" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Micro session</text>
<text x="178" y="476" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Offer a short voluntary next step.</text>
<rect x="820" y="350" width="560" height="280" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="820" y="350" width="560" height="16" rx="9" ry="9" fill="#68a6ca"/>
<text x="848" y="422" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Few reviews</text>
<text x="848" y="476" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Keep queue budget tiny. Later stays visible.</text>
<rect x="1490" y="350" width="560" height="280" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1490" y="350" width="560" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="1518" y="422" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">No streak system</text>
<text x="1518" y="476" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">No loss, freeze economy or guilt copy.</text>
<rect x="2160" y="350" width="560" height="280" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="2160" y="350" width="560" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="2188" y="422" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">No leaderboard</text>
<text x="2188" y="476" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Competition stays after MVP and gated.</text>
<rect x="150" y="740" width="560" height="280" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="150" y="740" width="560" height="16" rx="9" ry="9" fill="#d7ba59"/>
<text x="178" y="812" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">No SRS write</text>
<text x="178" y="866" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Recall does not touch word_progress.</text>
<rect x="820" y="740" width="560" height="280" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="820" y="740" width="560" height="16" rx="9" ry="9" fill="#8977c7"/>
<text x="848" y="812" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">No analytics impl</text>
<text x="848" y="866" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Metrics remain privacy-gated planning.</text>
<rect x="1490" y="740" width="560" height="280" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1490" y="740" width="560" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="1518" y="812" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">No sensitive retention</text>
<text x="1518" y="866" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Sensitive terms are never motivation hooks.</text>
<rect x="2160" y="740" width="560" height="280" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="2160" y="740" width="560" height="16" rx="9" ry="9" fill="#5bb8aa"/>
<text x="2188" y="812" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">No BuildState</text>
<text x="2188" y="866" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Feedback is not placement or frame_started.</text>
<rect x="370" y="1270" width="2260" height="350" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="370" y="1270" width="2260" height="16" rx="9" ry="9" fill="#68ad7a"/>
<text x="398" y="1342" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">MVP rule</text>
<text x="398" y="1396" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Learning -&gt; optional gentle signal -&gt; semantic outcome -&gt; queue eligibility -&gt; user choice or safe fallback. No push, no analytics, no automatic word placement, no BuildState.</text>
<rect x="620" y="1760" width="1760" height="185" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="620" y="1760" width="1760" height="16" rx="9" ry="9" fill="#94a09b"/>
<text x="648" y="1832" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Research boundary</text>
<text x="648" y="1886" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">M16-AI translates principles. It does not approve product mechanics, persistence, providers, metrics or app code.</text>
</svg>