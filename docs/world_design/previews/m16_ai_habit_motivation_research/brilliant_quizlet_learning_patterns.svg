<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2200" viewBox="0 0 3000 2200">
<rect width="3000" height="2200" fill="#f8f9f4"/>
<rect x="48" y="38" width="2904" height="2124" rx="30" ry="30" fill="#f8f9f4" stroke="#d8e0d8" stroke-width="2"/>
<text x="92" y="150" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#1f2c2a">Brilliant And Quizlet Learning Patterns</text>
<text x="92" y="207" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#66736d">Interactive meaning and recall are useful only when they stay short, optional and reversible.</text>
<line x1="92" y1="2090" x2="2908" y2="2090" stroke="#d8e0d8" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="2142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#66736d">documentation research preview only / no implementation / no analytics / no push retention / no SRS or word_progress write / no BuildState / no frame_started</text>
<rect x="140" y="360" width="1220" height="320" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="140" y="360" width="1220" height="16" rx="9" ry="9" fill="#68a6ca"/>
<text x="168" y="432" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Brilliant pattern</text>
<text x="168" y="486" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Interactive problem -&gt; visual explanation -&gt; direct feedback -&gt; small concept progress.</text>
<rect x="1640" y="360" width="1220" height="320" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1640" y="360" width="1220" height="16" rx="9" ry="9" fill="#5bb8aa"/>
<text x="1668" y="432" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Quizlet pattern</text>
<text x="1668" y="486" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Flashcard or Learn mode -&gt; recall attempt -&gt; user-controlled repeat -&gt; targeted practice.</text>
<line x1="720" y1="680" x2="720" y2="850" stroke="#95a59f" stroke-width="6" stroke-linecap="round"/>
<polygon points="720,850 702,822 738,822" fill="#95a59f"/>
<line x1="2250" y1="680" x2="2250" y2="850" stroke="#95a59f" stroke-width="6" stroke-linecap="round"/>
<polygon points="2250,850 2232,822 2268,822" fill="#95a59f"/>
<rect x="140" y="850" width="1220" height="370" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="140" y="850" width="1220" height="16" rx="9" ry="9" fill="#68ad7a"/>
<text x="168" y="922" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Talvori use</text>
<text x="168" y="976" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">ContextCards, ActionChallenges and Companion explanations can make meaning active without creating BuildState.</text>
<rect x="1640" y="850" width="1220" height="370" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1640" y="850" width="1220" height="16" rx="9" ry="9" fill="#68ad7a"/>
<text x="1668" y="922" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Talvori use</text>
<text x="1668" y="976" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Few voluntary recall moments can support learning without mass review or SRS writes.</text>
<rect x="360" y="1470" width="900" height="320" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="360" y="1470" width="900" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="388" y="1542" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Risk to avoid</text>
<text x="388" y="1596" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Too much interaction becomes cognitive load or a hidden obligation.</text>
<rect x="1740" y="1470" width="900" height="320" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1740" y="1470" width="900" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="1768" y="1542" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Risk to avoid</text>
<text x="1768" y="1596" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Large review queues turn motivation into homework debt.</text>
</svg>