<text x="92" y="150" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#1f2c2a">Duolingo Risk Translation</text>
<text x="92" y="207" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#66736d">Duolingo is useful as a pressure audit: Talvori translates value, not pressure mechanics.</text>
