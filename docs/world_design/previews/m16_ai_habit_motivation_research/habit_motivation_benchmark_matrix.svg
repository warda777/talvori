<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2200" viewBox="0 0 3000 2200">
<rect width="3000" height="2200" fill="#f8f9f4"/>
<rect x="48" y="38" width="2904" height="2124" rx="30" ry="30" fill="#f8f9f4" stroke="#d8e0d8" stroke-width="2"/>
<text x="92" y="150" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#1f2c2a">Habit And Motivation Benchmark Matrix</text>
<text x="92" y="207" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#66736d">Research compares principles. Talvori keeps learning quality above retention pressure.</text>
<line x1="92" y1="2090" x2="2908" y2="2090" stroke="#d8e0d8" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="2142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#66736d">documentation research preview only / no implementation / no analytics / no push retention / no SRS or word_progress write / no BuildState / no frame_started</text>
<rect x="130" y="350" width="570" height="470" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="130" y="350" width="570" height="16" rx="9" ry="9" fill="#68ad7a"/>
<text x="158" y="422" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Duolingo</text>
<text x="158" y="476" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">XP, streaks, daily goals, leagues, lessons.</text>
<text x="158" y="505" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Value: easy habit and visible progress.</text>
<text x="158" y="534" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Risk: FOMO, XP chase, league pressure.</text>
<rect x="850" y="350" width="570" height="470" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="850" y="350" width="570" height="16" rx="9" ry="9" fill="#68a6ca"/>
<text x="878" y="422" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Brilliant</text>
<text x="878" y="476" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Learn by doing, visual problems, direct feedback.</text>
<text x="878" y="505" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Value: meaning through action.</text>
<text x="878" y="534" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Risk: cognitive load if overused.</text>
<rect x="1570" y="350" width="570" height="470" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1570" y="350" width="570" height="16" rx="9" ry="9" fill="#5bb8aa"/>
<text x="1598" y="422" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Quizlet</text>
<text x="1598" y="476" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Flashcards, Learn, Test, Progress.</text>
<text x="1598" y="505" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Value: recall and user control.</text>
<text x="1598" y="534" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Risk: mass review and shallow cramming.</text>
<rect x="2290" y="350" width="570" height="470" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="2290" y="350" width="570" height="16" rx="9" ry="9" fill="#8977c7"/>
<text x="2318" y="422" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Anki / Recall</text>
<text x="2318" y="476" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Spacing and retrieval practice.</text>
<text x="2318" y="505" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Value: long-term memory.</text>
<text x="2318" y="534" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Risk: review debt and SRS mutation.</text>
<rect x="180" y="1040" width="1190" height="410" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="180" y="1040" width="1190" height="16" rx="9" ry="9" fill="#d7ba59"/>
<text x="208" y="1112" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">What Talvori can borrow</text>
<text x="208" y="1169" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#66736d">Micro sessions, quick feedback, interactive meaning, recall moments, calm progress, user control, and</text>
<text x="208" y="1201" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#66736d">measured learning quality.</text>
<rect x="1630" y="1040" width="1190" height="410" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1630" y="1040" width="1190" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="1658" y="1112" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">What Talvori must not copy</text>
<text x="1658" y="1169" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#66736d">Streak guilt, push pressure, leaderboards, XP grinding, mandatory reviews, sensitive retention</text>
<text x="1658" y="1201" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#66736d">triggers, or analytics without privacy gates.</text>
<line x1="1370" y1="1245" x2="1630" y2="1245" stroke="#95a59f" stroke-width="6" stroke-linecap="round"/>
<polygon points="1630,1245 1602,1227 1602,1263" fill="#95a59f"/>
<rect x="520" y="1640" width="1960" height="260" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="520" y="1640" width="1960" height="16" rx="9" ry="9" fill="#68ad7a"/>
<text x="548" y="1712" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">MVP decision</text>
<text x="548" y="1766" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Use pressure-free learning moments and optional review. Block streak loss, leaderboard ranking, push retention, SRS writes, analytics, BuildState and frame_started.</text>
</svg>