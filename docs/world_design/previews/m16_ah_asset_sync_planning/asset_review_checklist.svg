<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="2050" viewBox="0 0 2600 2050">
<rect width="2600" height="2050" fill="#f7f8f3"/>
<rect x="44" y="34" width="2512" height="1982" rx="28" ry="28" fill="#f7f8f3" stroke="#d6dfd7" stroke-width="2"/>
<text x="82" y="142" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#20302b">Asset Review Checklist</text>
<text x="82" y="194" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#62706a">A later real asset prompt must pass every review area before app use is even considered.</text>
<line x1="82" y1="1946" x2="2518" y2="1946" stroke="#d6dfd7" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="1998" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#62706a">documentation preview only / no app integration / no route / no assets / no persistence / no sync implementation / no BuildState / no frame_started</text>
<rect x="110" y="300" width="690" height="205" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="110" y="300" width="690" height="14" rx="8" ry="8" fill="#68ad7a"/>
<text x="136" y="368" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Source known</text>
<text x="136" y="415" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#62706a">origin, creator, generator or internal source documented</text>
<rect x="910" y="300" width="690" height="205" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="910" y="300" width="690" height="14" rx="8" ry="8" fill="#68a6ca"/>
<text x="936" y="368" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">License clear</text>
<text x="936" y="415" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#62706a">use rights and restrictions understood before file creation</text>
<rect x="1710" y="300" width="690" height="205" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1710" y="300" width="690" height="14" rx="8" ry="8" fill="#5bb8aa"/>
<text x="1736" y="368" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Use allowed</text>
<text x="1736" y="415" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#62706a">Talvori purpose matches license and product scope</text>
<rect x="110" y="555" width="690" height="205" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="110" y="555" width="690" height="14" rx="8" ry="8" fill="#d5b856"/>
<text x="136" y="623" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Purpose scoped</text>
<text x="136" y="670" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#62706a">asset solves a reviewed need, not a missing UX choice</text>
<rect x="910" y="555" width="690" height="205" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="910" y="555" width="690" height="14" rx="8" ry="8" fill="#d96f68"/>
<text x="936" y="623" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Sensitive-safe</text>
<text x="936" y="670" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#62706a">no deco, no reward, no dramatic symbol for sensitive topics</text>
<rect x="1710" y="555" width="690" height="205" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1710" y="555" width="690" height="14" rx="8" ry="8" fill="#8e7ac8"/>
<text x="1736" y="623" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Mobile readable</text>
<text x="1736" y="670" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#62706a">not too small; tap, label and clutter risk checked</text>
<rect x="110" y="810" width="690" height="205" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="110" y="810" width="690" height="14" rx="8" ry="8" fill="#68ad7a"/>
<text x="136" y="878" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Style fit</text>
<text x="136" y="925" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#62706a">fits Talvori visual direction and does not confuse docs with product</text>
<rect x="910" y="810" width="690" height="205" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="910" y="810" width="690" height="14" rx="8" ry="8" fill="#d96f68"/>
<text x="936" y="878" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">No auto word asset</text>
<text x="936" y="925" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#62706a">word, outcome, plot or capability cannot generate an image</text>
<rect x="1710" y="810" width="690" height="205" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1710" y="810" width="690" height="14" rx="8" ry="8" fill="#68a6ca"/>
<text x="1736" y="878" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Correct name</text>
<text x="1736" y="925" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#62706a">snake_case, meaningful family/state/variant, no test/final names</text>
<rect x="110" y="1065" width="690" height="205" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="110" y="1065" width="690" height="14" rx="8" ry="8" fill="#5bb8aa"/>
<text x="136" y="1133" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Correct path</text>
<text x="136" y="1180" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#62706a">docs preview stays in docs; app asset waits for asset gate</text>
<rect x="910" y="1065" width="690" height="205" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="910" y="1065" width="690" height="14" rx="8" ry="8" fill="#d5b856"/>
<text x="936" y="1133" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Visual QA</text>
<text x="936" y="1180" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#62706a">text, labels, frames and contact sheet are readable</text>
<rect x="1710" y="1065" width="690" height="205" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1710" y="1065" width="690" height="14" rx="8" ry="8" fill="#d96f68"/>
<text x="1736" y="1133" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">No runtime release</text>
<text x="1736" y="1180" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#62706a">no BuildState, persistence, route, sync or frame_started</text>
<rect x="310" y="1515" width="1980" height="190" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="310" y="1515" width="1980" height="14" rx="8" ry="8" fill="#d96f68"/>
<text x="336" y="1583" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Gate result</text>
<text x="336" y="1633" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">If any review answer is unclear, the safe result is Backlog, Later, ContextCard, CodexOnly or a separate follow-up gate.</text>
</svg>