<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1900" viewBox="0 0 2600 1900">
<rect width="2600" height="1900" fill="#f7f8f3"/>
<rect x="44" y="34" width="2512" height="1832" rx="28" ry="28" fill="#f7f8f3" stroke="#d6dfd7" stroke-width="2"/>
<text x="82" y="142" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#20302b">Asset Scope And Naming Rules</text>
<text x="82" y="194" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#62706a">M16-AH prepares rules only. No asset file, app asset path, BuildState or frame_started is unlocked.</text>
<line x1="82" y1="1796" x2="2518" y2="1796" stroke="#d6dfd7" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="1848" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#62706a">documentation preview only / no app integration / no route / no assets / no persistence / no sync implementation / no BuildState / no frame_started</text>
<rect x="120" y="310" width="560" height="250" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="120" y="310" width="560" height="14" rx="8" ry="8" fill="#68ad7a"/>
<text x="146" y="378" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Docs visual</text>
<text x="146" y="428" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">Lives under docs/world_design/previews.</text>
<text x="146" y="457" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">Never a game asset or screenshot substitute.</text>
<rect x="740" y="310" width="460" height="250" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="740" y="310" width="460" height="14" rx="8" ry="8" fill="#68a6ca"/>
<text x="766" y="378" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Placeholder</text>
<text x="766" y="428" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">Later only after its own gate.</text>
<text x="766" y="457" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">Cannot mask missing UX or safety</text>
<text x="766" y="486" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">decisions.</text>
<rect x="1260" y="310" width="500" height="250" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1260" y="310" width="500" height="14" rx="8" ry="8" fill="#5bb8aa"/>
<text x="1286" y="378" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Prototype asset</text>
<text x="1286" y="428" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">Only in a separately scoped local prototype.</text>
<text x="1286" y="457" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">No production meaning by default.</text>
<rect x="1820" y="310" width="660" height="250" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1820" y="310" width="660" height="14" rx="8" ry="8" fill="#8e7ac8"/>
<text x="1846" y="378" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Production asset</text>
<text x="1846" y="428" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">Needs source, license, purpose, style, mobile and policy</text>
<text x="1846" y="457" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">review.</text>
<rect x="190" y="740" width="1030" height="300" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="190" y="740" width="1030" height="14" rx="8" ry="8" fill="#d5b856"/>
<text x="216" y="808" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Naming plan</text>
<text x="216" y="861" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#62706a">Use snake_case, clear theme/family/state/variant, no spaces, no final.png or test.png,</text>
<text x="216" y="893" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#62706a">and no ambiguous filenames.</text>
<rect x="1380" y="740" width="1030" height="300" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1380" y="740" width="1030" height="14" rx="8" ry="8" fill="#68a6ca"/>
<text x="1406" y="808" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Source and license plan</text>
<text x="1406" y="861" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#62706a">Every later asset needs known source, license status, allowed use, purpose, scope and</text>
<text x="1406" y="893" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#62706a">review before any app path.</text>
<line x1="1220" y1="890" x2="1380" y2="890" stroke="#91a49e" stroke-width="6" stroke-linecap="round"/>
<polygon points="1380,890 1352,873 1352,907" fill="#91a49e"/>
<rect x="280" y="1245" width="2040" height="270" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="280" y="1245" width="2040" height="14" rx="8" ry="8" fill="#d96f68"/>
<text x="306" y="1313" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Hard stop</text>
<text x="306" y="1366" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#62706a">No automatic asset from word, semantics, plot, capability, review, BuildChoice or reward. No files under assets in this slice.</text>
<rect x="490" y="1610" width="206" height="42" rx="21" ry="21" fill="#68ad7a"/>
<text x="511" y="1640" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#ffffff">doc preview only</text>
<rect x="900" y="1610" width="195" height="42" rx="21" ry="21" fill="#68a6ca"/>
<text x="921" y="1640" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#ffffff">source required</text>
<rect x="1320" y="1610" width="197" height="42" rx="21" ry="21" fill="#8e7ac8"/>
<text x="1341" y="1640" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#ffffff">license required</text>
<rect x="1760" y="1610" width="174" height="42" rx="21" ry="21" fill="#d96f68"/>
<text x="1781" y="1640" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#ffffff">no auto asset</text>
</svg>