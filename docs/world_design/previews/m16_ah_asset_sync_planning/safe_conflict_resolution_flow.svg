<polygon points="1110,470 1082,453 1082,487" fill="#91a49e"/>
<line x1="1510" y1="470" x2="1610" y2="470" stroke="#91a49e" stroke-width="6" stroke-linecap="round"/>
<polygon points="1610,470 1582,453 1582,487" fill="#91a49e"/>
<line x1="1805" y1="590" x2="1210" y2="900" stroke="#91a49e" stroke-width="6" stroke-linecap="round"/>
<polygon points="1210,900 1238,883 1238,917" fill="#91a49e"/>
<line x1="1230" y1="1030" x2="1360" y2="1030" stroke="#91a49e" stroke-width="6" stroke-linecap="round"/>
<polygon points="1360,1030 1332,1013 1332,1047" fill="#91a49e"/>
<rect x="300" y="1390" width="2000" height="275" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="300" y="1390" width="2000" height="14" rx="8" ry="8" fill="#d96f68"/>
<text x="326" y="1458" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Never as conflict resolution</text>
<text x="326" y="1508" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">No automatic irreversible decision, no world placement, no BuildState, no frame_started, no asset, no persistence write, no safety override by user choice.</text>
</svg>