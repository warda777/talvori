<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="2050" viewBox="0 0 2600 2050">
<rect width="2600" height="2050" fill="#f7f8f3"/>
<rect x="44" y="34" width="2512" height="1982" rx="28" ry="28" fill="#f7f8f3" stroke="#d6dfd7" stroke-width="2"/>
<text x="82" y="142" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#20302b">Safe Conflict Resolution Flow</text>
<text x="82" y="194" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#62706a">Conflict handling must protect safety, data integrity, reversibility and user trust before any world effect.</text>
<line x1="82" y1="1946" x2="2518" y2="1946" stroke="#d6dfd7" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="1998" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#62706a">documentation preview only / no app integration / no route / no assets / no persistence / no sync implementation / no BuildState / no frame_started</text>
<rect x="110" y="350" width="390" height="240" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="110" y="350" width="390" height="14" rx="8" ry="8" fill="#68a6ca"/>
<text x="136" y="418" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Conflict detected</text>
<text x="136" y="468" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">local and remote disagree</text>
<rect x="610" y="350" width="390" height="240" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="610" y="350" width="390" height="14" rx="8" ry="8" fill="#d96f68"/>
<text x="636" y="418" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Safety check</text>
<text x="636" y="468" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">sensitive or policy risk wins</text>
<text x="636" y="497" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">immediately</text>
<rect x="1110" y="350" width="400" height="240" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1110" y="350" width="400" height="14" rx="8" ry="8" fill="#8e7ac8"/>
<text x="1136" y="418" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Protect learning data</text>
<text x="1136" y="468" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">no SRS or word_progress write</text>
<text x="1136" y="497" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">without gate</text>
<rect x="1610" y="350" width="400" height="240" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1610" y="350" width="400" height="14" rx="8" ry="8" fill="#5bb8aa"/>
<text x="1636" y="418" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Explain history</text>
<text x="1636" y="468" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">show what changed; no silent</text>
<text x="1636" y="497" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">overwrite</text>
<rect x="760" y="900" width="470" height="265" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="760" y="900" width="470" height="14" rx="8" ry="8" fill="#68ad7a"/>
<text x="786" y="968" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Reversible choice</text>
<text x="786" y="1018" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">Change, Later, Backlog, Codex or</text>
<text x="786" y="1047" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">ContextCard</text>
<rect x="1360" y="900" width="470" height="265" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1360" y="900" width="470" height="14" rx="8" ry="8" fill="#d5b856"/>
<text x="1386" y="968" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Later gate</text>
<text x="1386" y="1018" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">persistence, sync and tests only after own</text>
<text x="1386" y="1047" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">gate</text>
<line x1="500" y1="470" x2="610" y2="470" stroke="#91a49e" stroke-width="6" stroke-linecap="round"/>
<polygon points="610,470 582,453 582,487" fill="#91a49e"/>
