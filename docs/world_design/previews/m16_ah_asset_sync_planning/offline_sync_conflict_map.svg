<rect x="44" y="34" width="2512" height="1982" rx="28" ry="28" fill="#f7f8f3" stroke="#d6dfd7" stroke-width="2"/>
<text x="82" y="142" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#20302b">Offline And Sync Conflict Map</text>
<text x="82" y="194" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#62706a">Offline-first is likely important later, but M16-AH creates only conflict rules, not sync code.</text>
<line x1="82" y1="1946" x2="2518" y2="1946" stroke="#d6dfd7" stroke-width="2" stroke-linecap="round"/>
<text x="82" y="1998" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#62706a">documentation preview only / no app integration / no route / no assets / no persistence / no sync implementation / no BuildState / no frame_started</text>
<rect x="110" y="310" width="650" height="225" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="110" y="310" width="650" height="14" rx="8" ry="8" fill="#68a6ca"/>
<text x="136" y="378" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Offline practice</text>
<text x="136" y="428" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">word practiced locally</text>
<text x="136" y="457" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">no SRS write without gate</text>
<rect x="110" y="585" width="650" height="225" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="110" y="585" width="650" height="14" rx="8" ry="8" fill="#68a6ca"/>
