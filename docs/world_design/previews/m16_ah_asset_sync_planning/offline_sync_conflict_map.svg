<text x="1876" y="978" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">candidate or asset no longer valid</text>
<text x="1876" y="1007" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">return to review/backlog</text>
<rect x="1850" y="1135" width="650" height="225" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1850" y="1135" width="650" height="14" rx="8" ry="8" fill="#8e7ac8"/>
<text x="1876" y="1203" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Multi-device conflict</text>
<text x="1876" y="1253" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">different choices across devices</text>
<text x="1876" y="1282" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">needs safe resolution</text>
<rect x="940" y="650" width="720" height="440" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="940" y="650" width="720" height="14" rx="8" ry="8" fill="#d96f68"/>
<text x="966" y="718" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#20302b">Conflict review</text>
<text x="966" y="771" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#62706a">Safety first.</text>
<text x="966" y="803" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#62706a">No silent overwrite.</text>
<text x="966" y="835" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#62706a">No automatic placement.</text>
<text x="966" y="867" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#62706a">No BuildState.</text>
<text x="966" y="899" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#62706a">No SRS or word_progress write.</text>
<text x="966" y="931" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#62706a">Use safe fallback.</text>
