<text x="416" y="1663" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">Review, Backlog, Later, CodexOnly, ContextCard, Hide or SensitiveGated. Productive merge logic waits for a separate data gate.</text>
