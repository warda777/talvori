<text x="136" y="1253" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">resizing or slot idea</text>
<text x="136" y="1282" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">no auto migration</text>
<rect x="1850" y="310" width="650" height="225" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
