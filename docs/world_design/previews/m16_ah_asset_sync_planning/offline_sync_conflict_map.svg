<text x="1876" y="732" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">visible output can be blocked</text>
<rect x="1850" y="860" width="650" height="225" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
