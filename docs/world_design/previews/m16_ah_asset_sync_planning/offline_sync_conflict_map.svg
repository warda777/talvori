<text x="136" y="978" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">confirm, change, later or hide</text>
<text x="136" y="1007" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">must remain explainable</text>
<rect x="110" y="1135" width="650" height="225" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="110" y="1135" width="650" height="14" rx="8" ry="8" fill="#68a6ca"/>
