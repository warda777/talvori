<text x="136" y="703" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">sense or outcome changed</text>
<text x="136" y="732" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">may conflict with remote</text>
