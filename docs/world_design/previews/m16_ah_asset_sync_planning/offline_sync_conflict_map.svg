<text x="1876" y="428" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">older or newer data</text>
<text x="1876" y="457" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#62706a">not automatically truth</text>
<rect x="1850" y="585" width="650" height="225" rx="18" ry="18" fill="#ffffff" stroke="#d6dfd7" stroke-width="2"/>
<rect x="1850" y="585" width="650" height="14" rx="8" ry="8" fill="#8e7ac8"/>
