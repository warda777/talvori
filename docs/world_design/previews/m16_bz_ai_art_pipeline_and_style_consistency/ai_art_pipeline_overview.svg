<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">M16-BZ AI Art Production Pipeline Overview</title>
  <desc id="desc">A documentation-only pipeline diagram showing how references become a style bible, a controlled tool pipeline, postprocessed layers, QA, and engine-ready candidates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b252d"/>
      <stop offset="1" stop-color="#071318"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14333b"/>
      <stop offset="1" stop-color="#0c1c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffec9f"/>
      <stop offset="1" stop-color="#c59139"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#02090b" flood-opacity="0.38"/>
    </filter>
    <style>
      .title { font: 800 44px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff0c1; }
      .sub { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cdebe2; }
      .eyebrow { font: 800 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f4cd63; letter-spacing: 1.5px; }
      .h { font: 800 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff0c1; }
      .body { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #d6eee7; }
      .small { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b9d8cf; }
      .no { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f0d8c8; }
      .stroke { stroke: #d5c96a; stroke-opacity: 0.46; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="url(#bg)"/>
  <path d="M0 602 C250 520 425 646 690 574 C908 515 1120 595 1328 530 C1448 493 1530 512 1600 478 L1600 760 L0 760 Z" fill="#061116" opacity="0.45"/>

  <g transform="translate(48 44)">
    <text class="title" x="0" y="0">M16-BZ AI Art Production Pipeline</text>
    <text class="sub" x="0" y="34">Reference-based art production · docs only · no game assets · no plugin writes</text>
  </g>

  <g transform="translate(48 128)" filter="url(#shadow)">
    <rect x="0" y="0" width="232" height="210" rx="22" fill="url(#card)" class="stroke"/>
    <text class="eyebrow" x="24" y="34">1. REFERENCE</text>
    <text class="h" x="24" y="72">Art Direction</text>
    <text class="body" x="24" y="106">M16-BY v2 board</text>
    <text class="body" x="24" y="132">Reference image</text>
    <text class="body" x="24" y="158">Mood, camera, feel</text>
    <text class="small" x="24" y="188">Not an asset.</text>
  </g>

  <g transform="translate(312 128)" filter="url(#shadow)">
    <rect x="0" y="0" width="232" height="210" rx="22" fill="url(#card)" class="stroke"/>
    <text class="eyebrow" x="24" y="34">2. STYLE BIBLE</text>
    <text class="h" x="24" y="72">Rules</text>
    <text class="body" x="24" y="106">Perspective</text>
    <text class="body" x="24" y="132">Light + palette</text>
    <text class="body" x="24" y="158">Shapes + detail</text>
    <text class="small" x="24" y="188">M16-CA next.</text>
  </g>

  <g transform="translate(576 128)" filter="url(#shadow)">
    <rect x="0" y="0" width="232" height="210" rx="22" fill="url(#card)" class="stroke"/>
    <text class="eyebrow" x="24" y="34">3. TOOL PIPELINE</text>
    <text class="h" x="24" y="72">Controlled AI</text>
    <text class="body" x="24" y="106">Style reference</text>
    <text class="body" x="24" y="132">Structure reference</text>
    <text class="body" x="24" y="158">LoRA / ControlNet</text>
    <text class="small" x="24" y="188">No free prompts.</text>
  </g>

  <g transform="translate(840 128)" filter="url(#shadow)">
    <rect x="0" y="0" width="232" height="210" rx="22" fill="url(#card)" class="stroke"/>
    <text class="eyebrow" x="24" y="34">4. POSTPROCESS</text>
    <text class="h" x="24" y="72">Clean Layers</text>
    <text class="body" x="24" y="106">Crop + paintover</text>
    <text class="body" x="24" y="132">Separate layers</text>
    <text class="body" x="24" y="158">Export variants</text>
    <text class="small" x="24" y="188">No app write.</text>
  </g>

  <g transform="translate(1104 128)" filter="url(#shadow)">
    <rect x="0" y="0" width="232" height="210" rx="22" fill="url(#card)" class="stroke"/>
    <text class="eyebrow" x="24" y="34">5. QA</text>
    <text class="h" x="24" y="72">Consistency</text>
    <text class="body" x="24" y="106">Same camera</text>
    <text class="body" x="24" y="132">Same light</text>
    <text class="body" x="24" y="158">Same scale</text>
    <text class="small" x="24" y="188">Reject drift.</text>
  </g>

  <g transform="translate(1368 128)" filter="url(#shadow)">
    <rect x="0" y="0" width="184" height="210" rx="22" fill="#182e27" stroke="#f0cf63" stroke-width="3"/>
    <text class="eyebrow" x="22" y="34">6. CANDIDATE</text>
    <text class="h" x="22" y="72">Engine-ready</text>
    <text class="body" x="22" y="106">PNG/WebP</text>
    <text class="body" x="22" y="132">Transparent</text>
    <text class="body" x="22" y="158">Metadata</text>
    <text class="small" x="22" y="188">Asset gate later.</text>
  </g>

  <g stroke="#f2d770" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M280 233 L312 233"/>
    <path d="M544 233 L576 233"/>
    <path d="M808 233 L840 233"/>
    <path d="M1072 233 L1104 233"/>
    <path d="M1336 233 L1368 233"/>
    <path d="M300 217 L316 233 L300 249"/>
    <path d="M564 217 L580 233 L564 249"/>
    <path d="M828 217 L844 233 L828 249"/>
    <path d="M1092 217 L1108 233 L1092 249"/>
    <path d="M1356 217 L1372 233 L1356 249"/>
  </g>

  <g transform="translate(48 392)" filter="url(#shadow)">
    <rect x="0" y="0" width="704" height="224" rx="24" fill="#10252b" class="stroke"/>
    <text class="eyebrow" x="28" y="38">ROLE SPLIT</text>
    <text class="body" x="28" y="78">ChatGPT: direction, prompts, references, QA rules.</text>
    <text class="body" x="28" y="112">Codex: docs, pipeline, file boundaries, checks.</text>
    <text class="body" x="28" y="146">AI tool: controlled generation with references.</text>
    <text class="body" x="28" y="180">Design tools / artist: cleanup, layer export, final consistency.</text>
  </g>

  <g transform="translate(790 392)" filter="url(#shadow)">
    <rect x="0" y="0" width="762" height="224" rx="24" fill="#171b1d" stroke="#e07b5e" stroke-opacity="0.62" stroke-width="2"/>
    <text class="eyebrow" x="28" y="38">HARD STOPS</text>
    <g transform="translate(28 74)">
      <path d="M0 -12 L16 4 M16 -12 L0 4" stroke="#f26d54" stroke-width="4" stroke-linecap="round"/>
      <text class="no" x="34" y="0">No Codex redraw of strong reference images.</text>
    </g>
    <g transform="translate(28 112)">
      <path d="M0 -12 L16 4 M16 -12 L0 4" stroke="#f26d54" stroke-width="4" stroke-linecap="round"/>
      <text class="no" x="34" y="0">No assets under assets/ without Asset Gate.</text>
    </g>
    <g transform="translate(28 150)">
      <path d="M0 -12 L16 4 M16 -12 L0 4" stroke="#f26d54" stroke-width="4" stroke-linecap="round"/>
      <text class="no" x="34" y="0">No final assets without source, prompt, reference and license metadata.</text>
    </g>
    <g transform="translate(28 188)">
      <path d="M0 -12 L16 4 M16 -12 L0 4" stroke="#f26d54" stroke-width="4" stroke-linecap="round"/>
      <text class="no" x="34" y="0">No Flutter integration before art pipeline and asset specs are accepted.</text>
    </g>
  </g>

  <g transform="translate(48 664)">
    <rect x="0" y="0" width="1504" height="56" rx="18" fill="#102c33" stroke="#d5c96a" stroke-opacity="0.38"/>
    <text class="body" x="26" y="35">Next path: M16-CA Talvori Art Bible v1 -> M16-CB Starter Island Master Reference Set -> M16-CC Asset Family and Export Spec.</text>
  </g>
</svg>
