<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="title desc">
  <title id="title">Firenze Area-Specification Extraction Plan</title>
  <desc id="desc">Documentation-only flow: Master-SVG to extraction plan to planning registries to review gates, with runtime gate blocked.</desc>
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d2b"/>
      <stop offset="1" stop-color="#02070f"/>
    </linearGradient>
    <linearGradient id="panelBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="1" stop-color="#08101d"/>
    </linearGradient>
    <linearGradient id="panelGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063325"/>
      <stop offset="1" stop-color="#08101d"/>
    </linearGradient>
    <linearGradient id="panelPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22183b"/>
      <stop offset="1" stop-color="#08101d"/>
    </linearGradient>
    <linearGradient id="panelStop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1426"/>
      <stop offset="1" stop-color="#120914"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowHead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6fffe6"/>
    </marker>
    <marker id="stopHead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#ff86a8"/>
    </marker>
    <style>
      .title { font: 800 42px Inter, "SF Pro Display", Arial, sans-serif; fill: #f5fbff; }
      .subtitle { font: 700 21px Inter, "SF Pro Display", Arial, sans-serif; fill: #78fff0; }
      .small { font: 500 17px Inter, "SF Pro Display", Arial, sans-serif; fill: #b5ccd8; }
      .panelTitle { font: 800 25px Inter, "SF Pro Display", Arial, sans-serif; fill: #effaff; }
      .panelText { font: 650 18px Inter, "SF Pro Display", Arial, sans-serif; fill: #dcecf3; }
      .muted { font: 500 15px Inter, "SF Pro Display", Arial, sans-serif; fill: #9db8c7; }
      .chip { font: 800 14px Inter, "SF Pro Display", Arial, sans-serif; fill: #eafff8; }
      .arrow { fill: none; stroke: #6fffe6; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrowHead); }
      .stopArrow { fill: none; stroke: #ff86a8; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 8; marker-end: url(#stopHead); }
    </style>
  </defs>

  <rect width="1700" height="1120" fill="url(#bgGlow)"/>
  <ellipse cx="310" cy="170" rx="580" ry="190" fill="#12445a" opacity="0.22"/>
  <ellipse cx="1160" cy="205" rx="520" ry="185" fill="#45245d" opacity="0.15"/>
  <ellipse cx="890" cy="890" rx="850" ry="260" fill="#0c4739" opacity="0.16"/>

  <text x="48" y="70" class="title">Firenze Area-Specification Extraction Plan</text>
  <text x="50" y="106" class="subtitle">documentation_only | planning-only extraction plan | no runtime | no JSON/YAML | no Flutter</text>
  <text x="50" y="139" class="small">Master-SVG -> Extraction Plan -> Planning Registries -> Review Gates -> Runtime Gate blocked</text>

  <g transform="translate(54 188)">
    <rect width="295" height="330" rx="26" fill="url(#panelBlue)" stroke="#28dfff" stroke-width="1.5"/>
    <text x="26" y="45" class="panelTitle">Master-SVG</text>
    <text x="26" y="84" class="panelText">firenze_city_exploration</text>
    <text x="26" y="113" class="panelText">master.svg</text>
    <text x="26" y="151" class="muted">Source hash locked by 426</text>
    <text x="26" y="190" class="panelText">Boundary 1 | River 1</text>
    <text x="26" y="223" class="panelText">Parcels 14 | Bridges 8</text>
    <text x="26" y="256" class="panelText">Nodes 181 | Edges 221</text>
    <rect x="26" y="282" width="194" height="32" rx="12" fill="#073322" stroke="#7dffd7"/>
    <text x="43" y="304" class="chip">READ ONLY SOURCE</text>
  </g>

  <path d="M370 353 C430 353 448 353 500 353" class="arrow"/>

  <g transform="translate(520 188)">
    <rect width="295" height="330" rx="26" fill="url(#panelGreen)" stroke="#72ffdc" stroke-width="1.5"/>
    <text x="26" y="45" class="panelTitle">Extraction Plan</text>
    <text x="26" y="86" class="panelText">Define allowed reads</text>
    <text x="26" y="122" class="panelText">Define field families</text>
    <text x="26" y="158" class="panelText">Define data boundaries</text>
    <text x="26" y="194" class="panelText">Define stop rules</text>
    <text x="26" y="232" class="muted">No extraction yet</text>
    <text x="26" y="260" class="muted">No machine format yet</text>
    <rect x="26" y="282" width="177" height="32" rx="12" fill="#0c372c" stroke="#72ffdc"/>
    <text x="43" y="304" class="chip">PLAN, NOT DATA</text>
  </g>

  <path d="M836 353 C896 353 914 353 966 353" class="arrow"/>

  <g transform="translate(986 188)">
    <rect width="330" height="330" rx="26" fill="url(#panelPurple)" stroke="#c899ff" stroke-width="1.5"/>
    <text x="26" y="45" class="panelTitle">Planning Registries</text>
    <text x="26" y="86" class="panelText">source metadata</text>
    <text x="26" y="122" class="panelText">layer registry</text>
    <text x="26" y="158" class="panelText">object registry</text>
    <text x="26" y="194" class="panelText">topology registry</text>
    <text x="26" y="230" class="panelText">review flags</text>
    <text x="26" y="266" class="muted">All entries blocked for runtime</text>
    <rect x="26" y="282" width="214" height="32" rx="12" fill="#20133c" stroke="#c899ff"/>
    <text x="43" y="304" class="chip">PLANNING ONLY</text>
  </g>

  <path d="M1338 353 C1397 353 1410 353 1452 353" class="arrow"/>

  <g transform="translate(934 612)">
    <rect width="382" height="280" rx="26" fill="url(#panelGreen)" stroke="#72ffdc" stroke-width="1.5"/>
    <text x="26" y="45" class="panelTitle">Review Gates</text>
    <text x="26" y="86" class="panelText">SHA and layer counts</text>
    <text x="26" y="122" class="panelText">ID uniqueness</text>
    <text x="26" y="158" class="panelText">Edge endpoint resolution</text>
    <text x="26" y="194" class="panelText">No-Walk / No-Build review</text>
    <text x="26" y="230" class="panelText">Reachability review later</text>
    <text x="26" y="257" class="muted">Still no Runtime or Flutter</text>
  </g>

  <path d="M1155 536 C1155 565 1155 582 1155 604" class="arrow"/>

  <g transform="translate(1395 188)">
    <rect width="255" height="330" rx="26" fill="url(#panelStop)" stroke="#ff86a8" stroke-width="1.5"/>
    <text x="24" y="45" class="panelTitle">Runtime Gate</text>
    <text x="24" y="86" class="panelText">LOCKED</text>
    <text x="24" y="124" class="panelText">No JSON/YAML</text>
    <text x="24" y="160" class="panelText">No Flutter loader</text>
    <text x="24" y="196" class="panelText">No collision masks</text>
    <text x="24" y="232" class="panelText">No pathfinding</text>
    <text x="24" y="268" class="panelText">No asset output</text>
    <rect x="24" y="286" width="208" height="32" rx="12" fill="#3a1324" stroke="#ff86a8"/>
    <text x="42" y="308" class="chip">STOP BEFORE RUNTIME</text>
  </g>

  <path d="M1376 536 C1338 590 1308 618 1282 642" class="stopArrow"/>

  <g transform="translate(54 612)">
    <rect width="780" height="280" rx="26" fill="#071522" stroke="#28dfff" stroke-width="1.5"/>
    <text x="28" y="45" class="panelTitle">Minimal Fields Allowed in Next Slice</text>
    <text x="28" y="86" class="panelText">source_svg_path, source_svg_sha256, canvas_width, canvas_height, viewBox</text>
    <text x="28" y="124" class="panelText">layer_id, object_id, label, family, role, planning_status</text>
    <text x="28" y="162" class="panelText">no_walk_candidate, no_build_candidate, graph_from, graph_to</text>
    <text x="28" y="200" class="panelText">needs_review, blocked_for_runtime, source_trace</text>
    <text x="28" y="240" class="muted">No productive coordinates, no collision data, no Flutter data, no runtime polygons.</text>
  </g>

  <g transform="translate(54 952)">
    <rect width="1590" height="92" rx="24" fill="#061927" stroke="#28dfff" stroke-width="1"/>
    <text x="28" y="36" class="small">Recommended next slice: Firenze Area-Specification Planning Extraction v1.</text>
    <text x="28" y="66" class="muted">The next slice remains planning-only: Markdown review structure, no JSON/YAML/YML, no Runtime, no Flutter, no assets.</text>
  </g>
</svg>
