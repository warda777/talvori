<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Citizen Base 01 Aseprite Workflow</title>
  <desc id="desc">Documentation flow from design preview to Aseprite cleanup, exact PNG export, Codex intake, import gate and later motion lab.</desc>
  <defs>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#172016" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#35564c"/>
    </marker>
  </defs>
  <rect width="1400" height="520" fill="#f3efe4"/>
  <rect x="42" y="36" width="1316" height="448" rx="24" fill="#fffaf0" stroke="#d7c8a8" stroke-width="2"/>
  <text x="80" y="86" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#21362f">citizen_base_01 Aseprite production workflow</text>
  <text x="80" y="120" font-family="Inter, Arial, sans-serif" font-size="17" fill="#516059">Manual alpha-safe sprite production only. No runtime import, no auto cutout, no generated replacement figure.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g filter="url(#softShadow)">
      <rect x="80" y="174" width="178" height="166" rx="16" fill="#e9f0dc" stroke="#8da36f" stroke-width="2"/>
      <text x="105" y="214" font-size="20" font-weight="700" fill="#263a2c">1. Design</text>
      <text x="105" y="243" font-size="16" fill="#405344">Approved 8-dir</text>
      <text x="105" y="266" font-size="16" fill="#405344">style reference</text>
      <text x="105" y="300" font-size="14" fill="#667268">No asset import</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="300" y="174" width="178" height="166" rx="16" fill="#e7f4f1" stroke="#78a99e" stroke-width="2"/>
      <text x="325" y="214" font-size="20" font-weight="700" fill="#24423c">2. Aseprite</text>
      <text x="325" y="243" font-size="16" fill="#3f5b55">Manual alpha</text>
      <text x="325" y="266" font-size="16" fill="#3f5b55">cleanup</text>
      <text x="325" y="300" font-size="14" fill="#61756f">No RGB cutout</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="520" y="174" width="178" height="166" rx="16" fill="#f1ead8" stroke="#b99c5b" stroke-width="2"/>
      <text x="545" y="214" font-size="20" font-weight="700" fill="#4a3920">3. Export</text>
      <text x="545" y="243" font-size="16" fill="#5c4b31">PNG alpha</text>
      <text x="545" y="266" font-size="16" fill="#5c4b31">192 x 1024</text>
      <text x="545" y="300" font-size="14" fill="#766849">2 x 8, 96 x 128</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="740" y="174" width="178" height="166" rx="16" fill="#e9e6f3" stroke="#9286bd" stroke-width="2"/>
      <text x="765" y="214" font-size="20" font-weight="700" fill="#332d51">4. Codex</text>
      <text x="765" y="243" font-size="16" fill="#51496e">Technical</text>
      <text x="765" y="266" font-size="16" fill="#51496e">intake only</text>
      <text x="765" y="300" font-size="14" fill="#6d667f">Check, report</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="960" y="174" width="178" height="166" rx="16" fill="#f5e5df" stroke="#c58b75" stroke-width="2"/>
      <text x="985" y="214" font-size="20" font-weight="700" fill="#5c3327">5. Gate</text>
      <text x="985" y="243" font-size="16" fill="#684436">License and</text>
      <text x="985" y="266" font-size="16" fill="#684436">metadata</text>
      <text x="985" y="300" font-size="14" fill="#806053">No skip</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="1180" y="174" width="138" height="166" rx="16" fill="#dfeaf3" stroke="#7398b4" stroke-width="2"/>
      <text x="1202" y="214" font-size="20" font-weight="700" fill="#263b4b">6. Later</text>
      <text x="1202" y="243" font-size="16" fill="#3d5668">Motion</text>
      <text x="1202" y="266" font-size="16" fill="#3d5668">Lab 2B</text>
      <text x="1202" y="300" font-size="14" fill="#5f7483">after PASS</text>
    </g>

    <g stroke="#35564c" stroke-width="3" marker-end="url(#arrow)" fill="none">
      <line x1="264" y1="257" x2="291" y2="257"/>
      <line x1="484" y1="257" x2="511" y2="257"/>
      <line x1="704" y1="257" x2="731" y2="257"/>
      <line x1="924" y1="257" x2="951" y2="257"/>
      <line x1="1144" y1="257" x2="1171" y2="257"/>
    </g>
  </g>

  <rect x="80" y="386" width="1238" height="54" rx="14" fill="#fff4d8" stroke="#d5b76a" stroke-width="2"/>
  <text x="106" y="420" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#5d4720">Stop rule:</text>
  <text x="194" y="420" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5d4720">Codex checks and documents. Codex does not auto-freistellen, draw a replacement figure, or import to assets.</text>
</svg>
