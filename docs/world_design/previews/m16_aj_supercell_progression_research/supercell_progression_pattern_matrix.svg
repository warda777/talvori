<svg xmlns="http://www.w3.org/2000/svg" width="3100" height="2250" viewBox="0 0 3100 2250">
<rect width="3100" height="2250" fill="#f8f9f4"/>
<rect x="48" y="38" width="3004" height="2174" rx="30" ry="30" fill="#f8f9f4" stroke="#d8e0d8" stroke-width="2"/>
<text x="92" y="148" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#1f2c2a">Supercell Progression Pattern Matrix</text>
<text x="92" y="204" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#66736d">Clash patterns are useful research, but Talvori translates only safe principles.</text>
<line x1="92" y1="2138" x2="3008" y2="2138" stroke="#d8e0d8" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="2190" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#66736d">documentation research preview only / no implementation / no economy / no timers / no social or competition release / no BuildState / no frame_started</text>
<rect x="120" y="350" width="610" height="450" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="120" y="350" width="610" height="16" rx="9" ry="9" fill="#68ad7a"/>
<text x="148" y="422" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Base progression</text>
<text x="148" y="476" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Visible long-term growth.</text>
<text x="148" y="505" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Talvori value: owned world feeling.</text>
<text x="148" y="534" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Risk: BuildState and grind.</text>
<rect x="860" y="350" width="610" height="450" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="860" y="350" width="610" height="16" rx="9" ry="9" fill="#d7ba59"/>
<text x="888" y="422" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Resources / upgrades</text>
<text x="888" y="476" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Gold, elixir, gems, builders, magic items.</text>
<text x="888" y="505" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Value: planning.</text>
<text x="888" y="534" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Risk: timers and pay-to-progress.</text>
<rect x="1600" y="350" width="610" height="450" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1600" y="350" width="610" height="16" rx="9" ry="9" fill="#68a6ca"/>
<text x="1628" y="422" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Trade-offs</text>
<text x="1628" y="476" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Meaningful choices and strategic depth.</text>
<text x="1628" y="505" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Value: ownership.</text>
<text x="1628" y="534" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Risk: irreversible or unfair choices.</text>
<rect x="2340" y="350" width="610" height="450" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="2340" y="350" width="610" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="2368" y="422" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Clans / wars</text>
<text x="2368" y="476" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Group goals, coordination, rewards.</text>
<text x="2368" y="505" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Value: belonging.</text>
<text x="2368" y="534" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Risk: war pressure and blame.</text>
<rect x="250" y="1020" width="1200" height="370" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="250" y="1020" width="1200" height="16" rx="9" ry="9" fill="#68ad7a"/>
<text x="278" y="1092" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Talvori can learn</text>
<text x="278" y="1146" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Long-term ownership, visible possibility, small meaningful choices, belonging after privacy gates, and fair progression</text>
<text x="278" y="1175" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">language.</text>
<rect x="1650" y="1020" width="1200" height="370" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="1650" y="1020" width="1200" height="16" rx="9" ry="9" fill="#d86f68"/>
<text x="1678" y="1092" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">Talvori must block</text>
<text x="1678" y="1146" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Economy, timers, clan duty, leaderboards, raids, pay-to-win, world decay, social pressure, BuildState and</text>
<text x="1678" y="1175" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">frame_started.</text>
<line x1="1450" y1="1205" x2="1650" y2="1205" stroke="#95a59f" stroke-width="6" stroke-linecap="round"/>
<polygon points="1650,1205 1622,1187 1622,1223" fill="#95a59f"/>
<rect x="530" y="1640" width="2040" height="270" rx="20" ry="20" fill="#ffffff" stroke="#d8e0d8" stroke-width="2"/>
<rect x="530" y="1640" width="2040" height="16" rx="9" ry="9" fill="#5bb8aa"/>
<text x="558" y="1712" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2c2a">MVP boundary</text>
<text x="558" y="1766" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66736d">Progression is semantic: learning opens a safe option. The user may choose Later, Codex, Backlog or Preview Only. Nothing builds.</text>
</svg>