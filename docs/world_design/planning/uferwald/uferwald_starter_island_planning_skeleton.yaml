geometry_placeholders:
  allowed_placeholder_values:
    - manual_measurement_required
    - not_measured
    - blocked_until_measurement_gate
    - blocked_until_runtime_gate
    - review_required
  allowed_placeholder_roles:
    - geometry_kind_candidate
    - geometry_status
    - coordinate_space_convention
    - anchor_role_candidate
    - sort_band_role_candidate
    - measurement_question
    - qa_required
    - blocked_until_gate
  forbidden_placeholder_patterns:
    - numeric_x_or_y_examples
    - coordinate_pairs
    - point_arrays
    - empty_geometry_containers
    - runtime_centerline_placeholders

qa_requirements:
  m16_do_file_checks:
    - exactly_one_yaml_file_created
    - no_json_file_created
    - no_yml_file_created
    - no_assets_path_changes
    - no_code_changes
  skeleton_status_checks:
    - format_status_must_remain_planning_skeleton
    - runtime_status_must_remain_not_runtime_data
    - geometry_status_must_remain_no_geometry_values
    - coordinate_status_must_remain_no_final_coordinates
    - pixel_derivation_must_remain_forbidden
  future_review_checks:
    - m16_dp_review_required_before_any_skeleton_use
    - manual_measurement_gate_required_before_geometry_values
    - runtime_gate_required_before_runtime_map_data
    - asset_gate_required_before_any_assets_path

open_measurements:
  path_and_movement_questions:
    - where_walkable_corridors_should_be_vector_reviewed_later
    - where_station_candidates_should_be_measured_later
    - how_path_widths_should_be_verified_against_marker_size_later
