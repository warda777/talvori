    - how_free_capacity_can_be_reviewed_without_fixed_slots_later
    - which_future_footprint_classes_need_attachment_space_later
  sort_and_anchor_questions:
    - where_sort_band_roles_should_be_reviewed_later
    - which_landmarks_may_become_path_build_or_object_focus_references_later

blocked_scope:
  runtime_map_data: blocked
  final_coordinates: blocked
  polygons: blocked
  path_centerlines: blocked
  path_nodes: blocked
  path_edges: blocked
  build_zone_polygons: blocked
  plot_footprint_polygons: blocked
  no_walk_union_values: blocked
  no_build_union_values: blocked
  pixel_derived_values: blocked
  assets_path: blocked
  flutter_or_dart_code: blocked
  app_integration: blocked
  route_or_navigation: blocked
  persistence_or_buildstate: blocked

