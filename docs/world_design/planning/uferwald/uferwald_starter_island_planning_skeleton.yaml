format_status: planning_skeleton
runtime_status: not_runtime_data
asset_status: not_asset
engine_status: not_engine_ready
geometry_status: no_geometry_values
coordinate_status: no_final_coordinates
pixel_derivation_policy: pixel_derivation_forbidden
measurement_status: manual_measurement_required
runtime_review_requirement: runtime_review_required_before_use
source_truth_policy: technical_layers_not_art_pixels

schema_header:
  skeleton_id: uferwald_starter_island_planning_skeleton
  slice_id: M16-DO
  map_id: uferwald_starter_island
  file_role: planning_structure_only
  file_status: not_runtime_manifest
  created_for_next_review_gate: M16-DP
  exact_file_path: docs/world_design/planning/uferwald/uferwald_starter_island_planning_skeleton.yaml
  yaml_file_rule: only_yaml_file_allowed_for_m16_do

format_contract:
  preferred_format: yaml
  allowed_scope: planning_skeleton_fields_only
  maximum_status: planning_skeleton
  allowed_content:
    - status_protection
    - source_references
    - layer_ids
    - text_placeholders
    - qa_requirements
    - open_measurement_questions
    - blocked_scope
  forbidden_file_types:
    - ".json"
    - ".yml"
  forbidden_sibling_yaml_files: second_yaml_file_for_m16_do
  runtime_import_policy: forbidden
  app_integration_policy: forbidden

status_protection:
  required_top_level_status_fields:
    - format_status
    - runtime_status
    - asset_status
    - engine_status
    - geometry_status
    - coordinate_status
    - pixel_derivation_policy
    - measurement_status
    - runtime_review_requirement
    - source_truth_policy
  forbidden_fields:
    - geometry_values
    - coordinate_values
    - polygon_points
    - path_centerline
    - path_nodes
    - path_edges
    - build_zone_polygons
    - plot_footprint_polygons
    - no_walk_union_values
    - no_build_union_values
    - source_from_pixels
  forbidden_status_values:
    - "runtime_status: runtime_ready"
    - "asset_status: asset"
    - "engine_status: engine_ready"
  forbidden_value_patterns:
    - numeric_coordinate_examples
    - empty_geometry_lists
    - point_arrays
    - runtime_ready_flags
    - asset_path_references

source_docs:
  required_docs_read_for_m16_do:
    - docs/world_design/336-documentation-map-and-slice-reading-rules.md
    - docs/world_design/397-uferwald-json-yaml-planning-format-review.md
    - docs/world_design/396-uferwald-json-yaml-planning-format-gate.md
    - docs/world_design/395-uferwald-planning-schema-review.md
    - docs/world_design/394-uferwald-technical-planning-schema-gate.md
    - docs/world_design/393-uferwald-visual-precision-review.md
    - docs/world_design/392-uferwald-measurement-visual-precision-pass.md
    - docs/world_design/391-uferwald-measurement-precision-pass.md
    - docs/world_design/390-uferwald-technical-measurement-review.md
    - docs/world_design/389-uferwald-measurement-svg-documentation-plan.md
    - docs/world_design/388-uferwald-measurement-source-and-vector-workspace-plan.md
    - docs/world_design/387-uferwald-technical-measurement-and-vector-planning-gate.md
    - docs/world_design/386-uferwald-technical-layer-manifest.md
    - docs/world_design/385-uferwald-technical-layer-and-mask-spec.md
    - docs/world_design/384-uferwald-playable-map-layer-and-mask-architecture.md

visual_references:
  reference_policy: review_context_only
  technical_source_policy: never_derive_technical_values_from_visuals
  references:
    - reference_id: m16_di_visual_precision_views
      role: visual_review_context
      status: not_geometry_source
    - reference_id: m16_cp_uferwald_candidate
      role: art_and_structure_context
      status: not_technical_map

